name: Maestro E2E Tests

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'app_v2/**'
      - 'wear/**'
      - 'gradle/**'
      - '*.kts'
      - 'gradlew*'
      - 'maestro/**'                              # changes to the tests themselves should trigger E2E
      - '.github/workflows/maestro-tests.yml'
  workflow_dispatch:

# Cancel a still-running E2E when a newer commit lands on the same PR.
# Before this, every push to an open PR spawned ANOTHER macOS run in parallel.
concurrency:
  group: maestro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro-tests:
    name: Maestro E2E Tests
    # macos-latest (10x billing) -> ubuntu-latest (1x). GitHub Linux runners
    # expose nested virtualization (KVM), so the Android emulator stays
    # hardware-accelerated. ~90% cheaper per run if the repo is ever private;
    # faster scheduling even while public (macOS free concurrency is scarce).
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # setup-gradle caches dependencies AND the Gradle build cache
      # (setup-java's cache:gradle only caches downloaded deps).
      - name: Set up Gradle (deps + build cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Required so the Linux runner can use hardware-accelerated KVM.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build standard debug APK
        run: ./gradlew assembleStandardDebug --stacktrace
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY || 'dpy64e70kqobr6x' }}

      # Official Linux installer (replaces macOS-only, slow brew).
      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Verify Maestro installation
        run: maestro --version

      - name: Set up Android Emulator and run tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8192M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: |
            APK=$(find app_v2/build/outputs/apk/standard/debug -name "*.apk" | head -n 1)
            echo "Installing APK: $APK"
            adb install -r "$APK"
            adb shell pm list packages | grep fastmediasorter

            echo "Running smoke tests..."
            maestro test maestro/smoke/ || exit 1

            echo "Running critical path tests..."
            maestro test maestro/critical/ || exit 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-test-results
          path: |
            ~/.maestro/tests/
            maestro/
          retention-days: 30

      - name: Upload test recordings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-recordings
          path: ~/.maestro/tests/**/*.mp4
          retention-days: 7
