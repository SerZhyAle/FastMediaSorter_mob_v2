# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    # Rebuild the site ONLY when content that feeds it changes. Before this, a
    # pure-Kotlin commit to main rebuilt + redeployed the whole site.
    # NOTE: Jekyll source is './' (whole repo), so confirm this list covers
    # everything your site actually renders before relying on it.
    paths:
      - 'docs/**'
      - 'dev/Q/**'
      - '*.md'                 # root-level README etc. (not nested PLAN/*.md spec churn)
      - '*.html'               # landing pages (index / index-ru / index-uk / nolegal*)
      - '*.css'                # site stylesheet(s)
      - '*.js'                 # site scripts
      - '_config.yml'
      - 'assets/**'
      - 'icons/**'             # interface icons referenced by the docs/landing
      - '.github/workflows/jekyll-gh-pages.yml'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10        # safety cap against hung builds
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish dev/Q as standalone page
        run: |
          mkdir -p q
          cp dev/Q/index.html q/index.html
          cp dev/Q/index-en.html q/index-en.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10        # safety cap
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
