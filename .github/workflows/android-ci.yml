name: Android CI Quality Gate

on:
  push:
    branches: [ main, 'DEBUG-v*' ]
    paths:
      - 'app_v2/**'
      - 'wear/**'
      - 'gradle/**'
      - '*.kts'
      - 'gradlew*'
      - 'scripts/**'
      - 'dev/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app_v2/**'
      - 'wear/**'
      - 'gradle/**'
      - '*.kts'
      - 'gradlew*'
      - 'scripts/**'
      - 'dev/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform (default runs the full pipeline; regenerate-lint-baseline regenerates the lint baseline file)'
        type: choice
        options:
          - default
          - regenerate-lint-baseline
        default: default

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # verify = lint + unit tests + standard debug build in ONE Gradle call.
  # Previously these were 3 separate jobs (lint -> unit-tests -> build),
  # each on a cold runner restoring cache and recompiling standardDebug
  # from scratch (~3x compile + 2 extra cold setups). Now the sources are
  # compiled once and shared across lint/test/assemble. --continue runs all
  # three even if one fails, so every report is still produced.
  # ─────────────────────────────────────────────
  verify:
    name: Verify (lint + unit tests + standard build)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # setup-gradle adds the Gradle build cache on top of dependency caching.
      - name: Set up Gradle (deps + build cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Fetch prebuilt native AARs
        run: bash ./scripts/ci/fetch-prebuilt-libs.sh
        env:
          GH_TOKEN: ${{ github.token }}

      # One invocation so lint, the unit suite, the detector suite and assemble share a single
      # configuration + compile; separate steps would each pay a cold Gradle setup.
      # S1195: :lint-rules:test belongs in THIS job, not a separate one - the custom detectors are
      # what lintStandardDebug enforces, so a detector regression must fail the same job that runs
      # lint. Before S1195 the suite was reachable from no job and no script and had never run.
      - name: Lint + unit tests + detector tests + standard debug build (single invocation)
        run: ./gradlew :app_v2:lintStandardDebug :app_v2:testStandardDebugUnitTest :app_v2:assembleStandardDebug :wear:lintStandardDebug :wear:testStandardDebugUnitTest :wear:assembleStandardDebug :lint-rules:test --continue --stacktrace
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY || 'dpy64e70kqobr6x' }}

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app_v2/build/reports/lint-results-*.html
            app_v2/build/reports/lint-results.xml
          retention-days: 14

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            app_v2/build/reports/tests/
            app_v2/build/test-results/
            lint-rules/build/reports/tests/
          retention-days: 14

      - name: Publish test report summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Unit Test Results
          path: app_v2/build/test-results/**/*.xml
          reporter: java-junit
          fail-on-error: true

      # standard debug APK is produced here once and uploaded as an artifact.
      - name: Upload standard debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-standard-debug
          path: app_v2/build/outputs/apk/standard/debug/*.apk
          retention-days: 7

  # ─────────────────────────────────────────────
  # static-gates = pure-PowerShell quality gates (S2874). ~45 read-only text
  # scans from assert-fast-gates.ps1: neuroslop, source-gates, wear-parity,
  # exit-contract, script-parses, flavor-binding-coverage and more. No gradle,
  # no device - runs on ubuntu-latest with pwsh pre-installed. Triggers on
  # main, PR, DEBUG-v* and dispatch; the DEBUG-v* trigger catches regressions
  # before merge. dev/CATALOG/*.jsonl is gitignored, so catalog_sync.ps1
  # regenerates it before the gates run.
  # ─────────────────────────────────────────────
  static-gates:
    name: Static Gates (PowerShell quality checks)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerate gitignored Kotlin catalog (app_v2)
        run: pwsh -NoProfile -File scripts/catalog_sync.ps1 -Module app_v2

      - name: Regenerate gitignored Kotlin catalog (wear)
        run: pwsh -NoProfile -File scripts/catalog_sync.ps1 -Module wear

      - name: Run fast static gates
        run: pwsh -NoProfile -File scripts/quality/assert-fast-gates.ps1

  # ─────────────────────────────────────────────
  # Extra flavors only (lite, photos, legacy). standard is already built in
  # `verify`, so it is no longer rebuilt here. Runs on main push, PRs, and
  # manual dispatch only (see if: below). needs: verify -> a lint/test failure
  # short-circuits these expensive builds (fail-fast = saved minutes).
  # ─────────────────────────────────────────────
  build-flavors:
    name: Build (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    if: github.ref_name == 'main' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        flavor: [ lite, photos, legacy ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle (deps + build cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Fetch prebuilt native AARs
        run: bash ./scripts/ci/fetch-prebuilt-libs.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build ${{ matrix.flavor }} debug
        run: ./gradlew assemble${{ matrix.flavor }}Debug --stacktrace
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY || 'dpy64e70kqobr6x' }}

      - name: Upload ${{ matrix.flavor }} APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.flavor }}-debug
          path: app_v2/build/outputs/apk/${{ matrix.flavor }}/debug/*.apk
          retention-days: 7

  # ─────────────────────────────────────────────
  # R8/ProGuard release build check (standard, unsigned).
  # OPTIONAL extra saving: drop "github.ref_name == 'main'" so it runs only on
  # PRs + dispatch (a main push right after merge re-proves what the PR already
  # verified). Left enabled for safety.
  # ─────────────────────────────────────────────
  release-check:
    name: Release Build (ProGuard/R8 check)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: verify
    if: github.ref_name == 'main' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle (deps + build cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Fetch prebuilt native AARs
        run: bash ./scripts/ci/fetch-prebuilt-libs.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build standard release (unsigned)
        run: ./gradlew :app_v2:assembleStandardRelease :wear:assembleStandardRelease --stacktrace
        env:
          SKIP_SIGNING: true

      - name: Upload release build mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-mapping
          path: app_v2/build/outputs/mapping/
          retention-days: 14

  # ─────────────────────────────────────────────
  # regenerate-lint-baseline = delete the old lint-baseline.xml, run lintStandardDebug
  # (which creates a fresh baseline with all current issues), and commit the result.
  # Triggered manually via workflow_dispatch with action=regenerate-lint-baseline.
  # The regular verify job runs lintStandardDebug with abortOnError=true, which passes
  # only when all issues are in the baseline. When the baseline drifts (new code, new
  # lint checks, or a broken regeneration), this job brings it back in sync from the
  # CI environment where lint runs to completion. S2883.
  # ─────────────────────────────────────────────
  regenerate-lint-baseline:
    name: Regenerate Lint Baseline
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'regenerate-lint-baseline'
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle (deps + build cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Fetch prebuilt native AARs
        run: bash ./scripts/ci/fetch-prebuilt-libs.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Delete old baseline
        run: rm -f app_v2/lint-baseline.xml

      - name: Run lint to regenerate baseline
        run: ./gradlew :app_v2:lintStandardDebug --continue --stacktrace
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY || 'dpy64e70kqobr6x' }}

      - name: Verify baseline was created
        run: test -f app_v2/lint-baseline.xml

      - name: Commit and push new baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app_v2/lint-baseline.xml
          git commit -m "chore: regenerate lint baseline (S2883)" || echo "Nothing to commit"
          git push

  # ─────────────────────────────────────────────
  # Pipeline status notification. Job references updated to the new structure.
  # ─────────────────────────────────────────────
  notify:
    name: Pipeline Status Notification
    runs-on: ubuntu-latest
    if: always()
    needs: [ verify, static-gates, build-flavors, release-check ]
    timeout-minutes: 5

    steps:
      - name: Determine overall status
        id: overall
        run: |
          VERIFY="${{ needs.verify.result }}"
          GATES="${{ needs.static-gates.result }}"
          FLAVORS="${{ needs.build-flavors.result }}"
          RELEASE="${{ needs.release-check.result }}"
          if [[ ("$VERIFY" == "success" || "$VERIFY" == "skipped") && ("$GATES" == "success" || "$GATES" == "skipped") && ("$FLAVORS" == "success" || "$FLAVORS" == "skipped") && ("$RELEASE" == "success" || "$RELEASE" == "skipped") ]]; then
            echo "status=✅ ALL PASSED" >> "$GITHUB_OUTPUT"
            echo "emoji=✅" >> "$GITHUB_OUTPUT"
          else
            echo "status=❌ FAILURE" >> "$GITHUB_OUTPUT"
            echo "emoji=❌" >> "$GITHUB_OUTPUT"
          fi

      - name: Write GitHub Step Summary
        run: |
          {
            echo "## ${{ steps.overall.outputs.emoji }} Android CI - ${{ steps.overall.outputs.status }}"
            echo ""
            echo "| Job | Result |"
            echo "| --- | ------ |"
            echo "| Verify (lint+test+std) | ${{ needs.verify.result }} |"
            echo "| Static gates           | ${{ needs.static-gates.result }} |"
            echo "| Build (extra flavors)  | ${{ needs.build-flavors.result }} |"
            echo "| Release check          | ${{ needs.release-check.result }} |"
            echo ""
            echo "**Ref**: \`${{ github.ref_name }}\` | **Commit**: \`${{ github.sha }}\`"
            echo "**Triggered by**: ${{ github.event_name }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR (on failure)
        if: github.event_name == 'pull_request' && (needs.verify.result == 'failure' || needs.static-gates.result == 'failure' || needs.build-flavors.result == 'failure' || needs.release-check.result == 'failure')
        uses: actions/github-script@v7
        with:
          script: |
            const verify  = '${{ needs.verify.result }}';
            const gates   = '${{ needs.static-gates.result }}';
            const flavors = '${{ needs.build-flavors.result }}';
            const release = '${{ needs.release-check.result }}';
            const body = [
              '## ❌ Android CI - pipeline failure',
              '',
              '| Job | Result |',
              '| --- | ------ |',
              `| Verify (lint+test+std) | ${verify}  |`,
              `| Static gates           | ${gates}   |`,
              `| Build (extra flavors)  | ${flavors} |`,
              `| Release check          | ${release} |`,
              '',
              `**Commit**: \`${{ github.sha }}\``,
              'Please fix failing jobs before merging.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
