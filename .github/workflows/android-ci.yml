name: Android CI Quality Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Android Lint — blocks merge on failure
  # ─────────────────────────────────────────────
  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android Lint (standard flavor)
        run: ./gradlew lintStandardDebug --stacktrace

      - name: Upload Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app_v2/build/reports/lint-results-*.html
          retention-days: 14

  # ─────────────────────────────────────────────
  # Job 2: Unit Tests — blocks merge on failure
  # ─────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testStandardDebugUnitTest --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            app_v2/build/reports/tests/
            app_v2/build/test-results/
          retention-days: 14

      - name: Publish test report summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Unit Test Results
          path: app_v2/build/test-results/**/*.xml
          reporter: java-junit
          fail-on-error: true

  # ─────────────────────────────────────────────
  # Job 3: Build checks — all flavors
  # ─────────────────────────────────────────────
  build:
    name: Build (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        flavor: [ standard, lite, photos, legacy ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build ${{ matrix.flavor }} debug
        run: ./gradlew assemble${{ matrix.flavor }}Debug --stacktrace
        env:
          # Dropbox App Key — override with secret if available
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY || 'dpy64e70kqobr6x' }}

      - name: Upload ${{ matrix.flavor }} APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.flavor }}-debug
          path: app_v2/build/outputs/apk/${{ matrix.flavor }}/debug/*.apk
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 4: ProGuard/R8 release build check
  # ─────────────────────────────────────────────
  build-release-check:
    name: Release Build (ProGuard/R8 check)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build standard release (unsigned)
        run: ./gradlew assembleStandardRelease --stacktrace
        env:
          # Skip signing — only verify R8/ProGuard compiles
          SKIP_SIGNING: true

      - name: Upload release build mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-mapping
          path: app_v2/build/outputs/mapping/
          retention-days: 14

  # ─────────────────────────────────────────────
  # Job 5: Pipeline status notification
  # Summarises all job outcomes in the GitHub
  # workflow run page and posts a comment on PRs.
  # ─────────────────────────────────────────────
  notify-status:
    name: Pipeline Status Notification
    runs-on: ubuntu-latest
    # Always run; collect outcomes from all prior jobs.
    if: always()
    needs: [ lint, unit-tests, build, build-release-check ]

    steps:
      - name: Determine overall status
        id: overall
        run: |
          LINT="${{ needs.lint.result }}"
          TESTS="${{ needs.unit-tests.result }}"
          BUILD="${{ needs.build.result }}"
          RELEASE="${{ needs.build-release-check.result }}"

          if [[ "$LINT" == "success" && "$TESTS" == "success" && "$BUILD" == "success" && "$RELEASE" == "success" ]]; then
            echo "status=✅ ALL PASSED" >> "$GITHUB_OUTPUT"
            echo "emoji=✅" >> "$GITHUB_OUTPUT"
          else
            echo "status=❌ FAILURE" >> "$GITHUB_OUTPUT"
            echo "emoji=❌" >> "$GITHUB_OUTPUT"
          fi

      - name: Write GitHub Step Summary
        run: |
          {
            echo "## ${{ steps.overall.outputs.emoji }} Android CI — ${{ steps.overall.outputs.status }}"
            echo ""
            echo "| Job | Result |"
            echo "| --- | ------ |"
            echo "| Lint            | ${{ needs.lint.result }} |"
            echo "| Unit Tests      | ${{ needs.unit-tests.result }} |"
            echo "| Build (flavors) | ${{ needs.build.result }} |"
            echo "| Release check   | ${{ needs.build-release-check.result }} |"
            echo ""
            echo "**Ref**: \`${{ github.ref_name }}\` | **Commit**: \`${{ github.sha }}\`"
            echo "**Triggered by**: ${{ github.event_name }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR (on failure)
        # Post a comment only when running on a pull-request event AND something failed.
        if: github.event_name == 'pull_request' && needs.lint.result != 'success' || github.event_name == 'pull_request' && needs.unit-tests.result != 'success' || github.event_name == 'pull_request' && needs.build.result != 'success' || github.event_name == 'pull_request' && needs.build-release-check.result != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const lintStatus   = '${{ needs.lint.result }}';
            const testsStatus  = '${{ needs.unit-tests.result }}';
            const buildStatus  = '${{ needs.build.result }}';
            const releaseStatus = '${{ needs.build-release-check.result }}';

            const body = [
              '## ❌ Android CI — pipeline failure',
              '',
              '| Job | Result |',
              '| --- | ------ |',
              `| Lint            | ${lintStatus}   |`,
              `| Unit Tests      | ${testsStatus}  |`,
              `| Build (flavors) | ${buildStatus}  |`,
              `| Release check   | ${releaseStatus}|`,
              '',
              `**Commit**: \`${{ github.sha }}\``,
              'Please fix failing jobs before merging.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner:   context.repo.owner,
              repo:    context.repo.repo,
              issue_number: context.issue.number,
              body
            });
