# CRITICAL: Do not change - Use Android Studio's bundled JDK 21 (JDK 25 is not compatible with the current Gradle 9.4.1 / AGP 9.2.0 toolchain)
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED -Djava.io.tmpdir=P:/ANDROID/FastMediaSorter_mob_v2/temp/gradle-tmp -Dorg.sqlite.tmpdir=P:/ANDROID/FastMediaSorter_mob_v2/temp/gradle-tmp
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableJetifier=false

# Gradle Configuration Cache is DISABLED.
# Chaquopy 17.x (noLegal flavor, S0174) holds non-serializable Gradle API types
# (DefaultProject, DefaultConfigurationContainer, DefaultDependencyHandler,
# ReentrantLock, ReferenceQueue) in task actions. These cause ConfigurationCacheError
# during the CC store phase - thrown from onError() regardless of problems=warn.
# There is no Gradle public API to disable CC conditionally per-flavor from
# settings.gradle.kts (CC is initialized before settings evaluation).
# Dedicated noLegal build scripts pass --no-configuration-cache explicitly.
# Re-enable when Chaquopy ships CC support. Related: S0175, S0174.
org.gradle.configuration-cache=false

# 16 KB page size support (mandatory for Google Play since Nov 1, 2025)
# Enables ELF alignment to 16 KB boundaries for Android 15+ compatibility
android.bundle.enableNativeLibraryAlignment=true

# Optimization flags for faster builds
org.gradle.parallel=true
# Cap worker count: Android single-module builds saturate at ~6 workers in practice;
# 8 covers peak + wear-module parallelism without spawning 20 idle JVM threads.
org.gradle.workers.max=8
# settings.gradle.kts disables the local build cache on Windows because Gradle 9.x
# can fail while packing cache entries (for example RClassOutputJar).
org.gradle.caching=true
## Disabled to avoid incubating feature warning in build output
# org.gradle.configureondemand=true
org.gradle.daemon=true
kotlin.incremental=true
kapt.incremental.apt=true
# Force kapt to run in-process (same JVM as Gradle) so java.io.tmpdir is inherited
kapt.use.worker.api=false
kotlin.caching.enabled=true
# Kotlin compiler daemon: increased heap to 4g - VideoPlayerManager.kt is 1700+ lines with many coroutines,
# which causes OOM in ControlFlowGraph$Builder when building parallel flavor variants.
# TODO: Split VideoPlayerManager.kt into helper files to reduce coroutine state-machine size.
kotlin.daemon.jvm.options=-Xmx4g --enable-native-access=ALL-UNNAMED -Djava.io.tmpdir=P:/ANDROID/FastMediaSorter_mob_v2/temp/gradle-tmp -Dorg.sqlite.tmpdir=P:/ANDROID/FastMediaSorter_mob_v2/temp/gradle-tmp
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
# builtInKotlin=false REQUIRED while kotlin-kapt is in use.
# To remove this warning: migrate Hilt/Room annotation processors to KSP (kapt -> ksp).
# See: https://developer.android.com/r/tools/built-in-kotlin
android.builtInKotlin=false
# newDsl=false required by AGP when builtInKotlin=false (kapt compat mode).
android.newDsl=false
# Suppress noisy "excludeLibraryComponentsFromConstraints" performance hint spam
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
