# Toolchain JDK: build with a JDK 17, 21, or 25 install (JDK 26 is NOT compatible with the
# current Gradle 9.4.1 / AGP 9.2.1 toolchain). org.gradle.java.home is intentionally
# NOT committed here: it is a machine-specific absolute path that aborts the Linux CI
# runner before any task runs. Set it per-developer in your user-level Gradle config:
#   %USERPROFILE%\.gradle\gradle.properties  ->  org.gradle.java.home=C:/Program Files/Java/latest/jdk-21
# S1425: name a standalone JDK here, NOT the JBR inside Android Studio. This line used to
# prescribe the JBR, and a partial Studio uninstall then left jbr/bin/java.exe in place while
# deleting jbr/lib/jvm.cfg. The daemon already running kept compiling from memory, so every
# compile check stayed green and only forked JVMs failed - the entire unit-test tier was down
# for hours before anything reported it. scripts/utils/agent-lock.ps1 now preflights this JVM
# and exits 3 before any gradle task starts.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableJetifier=false

# S0630: Release-A gate. 'off' drops the screen-capture features (menu screenshot ->
# FOREGROUND_SERVICE_MEDIA_PROJECTION, edge-gesture overlay -> FOREGROUND_SERVICE_SPECIAL_USE) from
# the STANDARD build so a Play release needs no new foreground-service declaration. Standard only;
# noLegal/photos/lite/legacy/vr unaffected. Remove this line (or set 'on') for the full-feature
# Release B that declares both FGS types. Read in app_v2/build.gradle.kts.
fms.screenCapture=on
fms.edgeGestureOverlay=on
# S0672: independent QS-tile fallback trigger (no specialUse / SYSTEM_ALERT_WINDOW); enabled instead of
# the strip if Play rejects the specialUse declaration. Standard only. Read in app_v2/build.gradle.kts.
fms.edgeGestureTile=off

# Gradle Configuration Cache is DISABLED by default for direct IDE/Gradle safety.
# Chaquopy 17.x still breaks CC store for the noLegal task graph (external process at
# configuration time + non-serializable task state on extractNoLegalDebugPythonBuildPackages).
# Non-noLegal helper scripts must opt in with --configuration-cache explicitly; noLegal
# scripts should keep passing --no-configuration-cache to document the invariant.
org.gradle.configuration-cache=false

# 16 KB page size support (mandatory for Google Play since Nov 1, 2025)
# Enables ELF alignment to 16 KB boundaries for Android 15+ compatibility
android.bundle.enableNativeLibraryAlignment=true

# Optimization flags for faster builds
org.gradle.parallel=true
# Cap worker count: Android single-module builds saturate at ~6 workers in practice;
# 8 covers peak + wear-module parallelism without spawning 20 idle JVM threads.
org.gradle.workers.max=8
# settings.gradle.kts disables the local build cache on Windows because Gradle 9.x
# can fail while packing cache entries (for example RClassOutputJar).
# S1338: so on a Windows dev host this property is INERT - no remote cache is configured
# either, and every build prints "Using the build cache is enabled, but no build caches are
# configured or enabled." That log line is the setting working as configured, not a warning
# to chase. Consequence: every flavor switch recompiles from zero. Re-enabling needs a green
# tree to measure a repeated flavor switch on, with and without the local cache - see
# PLAN/S1338_agent-process-overhaul/PHASE_06__build-hot-path.md step 06.4.
org.gradle.caching=true
## Disabled to avoid incubating feature warning in build output
# org.gradle.configureondemand=true
org.gradle.daemon=true
kotlin.incremental=true
kotlin.caching.enabled=true
# Dagger 2.58+ enables the new binding graph fix by default. Keep legacy behaviour
# until the repo's existing Hilt graph is migrated to the stricter validation model.
dagger.useBindingGraphFix=disabled
# Kotlin compiler daemon: heap kept at 4g. VideoPlayerManager.kt was reduced from 1700+ to 706 LOC
# by S0274 Wave 01 (extracted VideoPlayerErrorHandler / VideoPlaybackPreflightHelper /
# VideoPlayerTracksObserver), but remaining hotspots PlayerActivity (1726), TextViewerManager (1486),
# PdfViewerManager (1418), ImageLoadingManager (1278), EpubViewerManager (1225), CommandPanelController
# (1204), PlayerManagerInitializer (1175) still keep ControlFlowGraph$Builder under pressure during
# parallel flavor compilation. Lowering below 4g is data-driven and lives outside S0274 - revisit
# only after the next ~3 backlog waves (PlayerActivity, the viewers) land.
# TODO: continue S0274 backlog waves before lowering the heap budget.
kotlin.daemon.jvm.options=-Xmx4g --enable-native-access=ALL-UNNAMED
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
# KSP still wires generated sources through kotlin.sourceSets under built-in Kotlin.
# Keep this override until the KSP plugin switches to AndroidSourceSet.kotlin.
android.disallowKotlinSourceSets=false
# S1375: KSP2 crashes when the Gradle cache and the project sit on different Windows drives.
# Its incremental bookkeeping relativizes every classpath entry against the module directory, and
# Path.relativize throws on a cross-root pair - here a Glide class inside a transformed jar under
# C:\Users\<user>\.gradle against P:\..\app_v2:
#   e: [ksp] java.lang.IllegalArgumentException: this and base files have different roots
# The task dies before compileStandardDebugKotlin runs, so NO Kotlin in app_v2 compiles at all.
# KSP1 is not an escape - the plugin removed it ("KSP1 is no longer available", verified 2026-08-03).
# Turning the bookkeeping off costs a full KSP pass per source change: measured 24 s for a one-file
# edit versus a 2 s no-op run, still inside the fast-check band, and a no-change run stays UP-TO-DATE.
# Inert on a single-root layout (Linux CI, or a cache on the same drive) - nothing to relativize
# across roots there. Drop this line only after KSP fixes the cross-root path computation upstream.
ksp.incremental=false
# Suppress noisy "excludeLibraryComponentsFromConstraints" performance hint spam
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# S3155: a declared baseline that does not exist is CREATED by lint, which then fails the build with
# "Aborting build since new baseline file was created". Measured 2026-09-15 on the first wear lint
# run: it silently wrote all 199 current findings into a new lint-baseline.xml - the blanket
# regeneration the ticket exists to prevent, arrived at by configuration rather than by choice, and
# indistinguishable afterwards from a deliberate one. With this flag a missing baseline means an
# empty baseline: lint reports everything and writes nothing. A baseline is then only ever produced
# by asking for one - check-lint.ps1 -Regenerate, or the regenerate-lint-baseline CI job.
android.experimental.lint.missingBaselineIsEmptyBaseline=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# S2585: ceiling on ONE unit-test task, in minutes, read by both app_v2 and wear so the two modules
# cannot drift to two different numbers.
#
# What it does NOT do: kill the forked test worker. Gradle's Task.timeout interrupts only the
# daemon-side thread coordinating the task (TimeoutStep calls Thread.interrupted(), and
# DefaultTimeoutHandler.onTimeout() does exactly one thing - thread.interrupt()); the path that can
# stop a worker, DefaultTestExecuter.stopNow(), is wired to --fail-fast and not to the timeout. A
# worker spinning RUNNABLE never checks the interrupt flag, which is why the 2026-09-05 hang also
# ignored kotlinx-coroutines-test's own 60-second runTest timeout and ran past 100 minutes.
#
# What it DOES do: end the TASK, so the wrapper stops waiting, reaches its finally, releases
# Build.Phone and reaps the worker there (scripts/builders/gradle-worker-reaper.ps1). Without it the
# hung task held the domain and 11 sessions queued behind it, the head waiting 48 minutes.
#
# The value: measured 2026-09-05 across that day's runs, the longest GREEN Unit run was 5m53s for
# app_v2 (whole build, compile and KSP included - the task alone is shorter) and 1m43s for wear; the
# longest red was 8m37s. 20 minutes leaves more than triple the headroom over the worst green run
# while capping a hang at a fifth of the 102 minutes actually observed.
fms.unitTestTimeoutMinutes=20

# S2851: parallel fork count for unit-test tasks, read by both app_v2 and wear so one value serves
# both modules the way fms.unitTestTimeoutMinutes above already does.
#
# What it does: sets maxParallelForks on every Test task. The Gradle default of 1 runs 695 classes
# strictly serially, and the whole-suite wall clock was 706 s / 700 s (two clean passes). The cost is
# serial test execution: in the 706 s run, reported test time was 415.6 s against 430 s wall clock,
# so Gradle overhead is under 4%. No single slow class to fix: the heaviest is 14.1 s and 604 of 695
# finish under 1 s.
#
# The value, measured 2026-09-10, app_v2 StandardDebug whole suite, 695 classes, 5033 tests, same
# pre-existing failures in every run, all rows ConcurrentRuns = 0 (no sibling gradle activity):
#
#   1 fork:  706 s, 700 s   (shipped default before this change)
#   2 forks: 280 s, 280 s
#   4 forks: 208 s, 217 s
#   8 forks: 148 s, 176 s   (chosen)
# 124 forks: 177 s          (slower than 8 - the curve turns above 8)
#
# Wear at 8 forks: 21 s (152 tests, BUILD SUCCESSFUL), down from 55 s serially.
# Memory at 8 forks: 23 GB free, 7 java processes on a 64 GB host.
fms.unitTestMaxParallelForks=8
