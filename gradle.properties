# CRITICAL: Do not change - Use Android Studio's bundled JDK 21 (JDK 25 is not compatible with Gradle 8.11.1)
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED -Djava.io.tmpdir=C:/GIT/FastMediaSorter_mob_v2/temp/gradle-tmp -Dorg.sqlite.tmpdir=C:/GIT/FastMediaSorter_mob_v2/temp/gradle-tmp
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableJetifier=false

# R8 full mode disabled for faster builds (Compat mode)
android.enableR8.fullMode=false

# Enable Gradle Configuration Cache for faster build start
org.gradle.configuration-cache=true

# 16 KB page size support (mandatory for Google Play since Nov 1, 2025)
# Enables ELF alignment to 16 KB boundaries for Android 15+ compatibility
android.bundle.enableNativeLibraryAlignment=true

# Optimization flags for faster builds
org.gradle.parallel=true
org.gradle.caching=true
## Disabled to avoid incubating feature warning in build output
# org.gradle.configureondemand=true
org.gradle.daemon=true
kotlin.incremental=true
kapt.incremental.apt=true
# Force kapt to run in-process (same JVM as Gradle) so java.io.tmpdir is inherited
kapt.use.worker.api=false
kotlin.caching.enabled=true
# Kotlin compiler daemon: propagate native-access flag (separate JVM from Gradle daemon)
kotlin.daemon.jvm.options=--enable-native-access=ALL-UNNAMED
