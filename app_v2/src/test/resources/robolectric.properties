# S2750: every Robolectric test boots the real application, and on a test pinned below SDK 33 the
# androidx.core receiver-permission emulation refuses to register until the app holds a permission
# Robolectric never grants. The subclass named here grants it and then delegates, so the fix covers
# future sub-33 tests as well as the three that failed.
application=com.sza.fastmediasorter.testing.RobolectricFastMediaSorterApp
# targetSdk 37 has no Robolectric 4.16.1 image, so a test with no @Config(sdk) failed in initialization;
# the default is the level most tests already pin, and a class or method @Config still overrides it.
sdk=34
