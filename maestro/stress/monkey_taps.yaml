appId: com.sza.fastmediasorter.debug
---
# Test: Monkey Random Taps
# Description: Stress test - random taps, double/triple taps, rapid fire to find crashes
# Duration: ~5-7 minutes (500+ tap actions including doubles/triples/bursts)
# Purpose: Detect ANR, crashes, unhandled exceptions under chaotic input
# Phases: 1) Random single taps, 2) Navigation + taps, 3) Swipes + taps,
#         4) Toolbar/navbar rapid taps, 5) Double taps, 6) Triple taps,
#         7) Mixed patterns, 8) Extreme rapid fire bursts

# Launch the app
- launchApp
- waitForAnimationToEnd

# Dismiss any permission dialogs
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    text: "Allow"
    optional: true
- waitForAnimationToEnd

# Phase 1: Random taps on main screen (50 taps)
# Note: Maestro doesn't support dynamic point variables in repeat blocks
# Using predefined random points instead
- repeat:
    times: 50
    commands:
      - tapOn:
          point: "25%,25%"
      - tapOn:
          point: "75%,25%"
      - tapOn:
          point: "50%,50%"
      - tapOn:
          point: "25%,75%"
      - tapOn:
          point: "75%,75%"

# Phase 2: Navigate somewhere then random taps (50 taps)
- launchApp
- waitForAnimationToEnd
- tapOn:
    text: "Local"
    optional: true
- waitForAnimationToEnd

- repeat:
    times: 10
    commands:
      - tapOn:
          point: "20%,20%"
      - tapOn:
          point: "80%,20%"
      - tapOn:
          point: "50%,40%"
      - tapOn:
          point: "30%,70%"
      - tapOn:
          point: "70%,80%"

# Phase 3: Random swipes mixed with taps (50 actions)
- launchApp
- waitForAnimationToEnd

- repeat:
    times: 10
    commands:
      - tapOn:
          point: "15%,20%"
      - scroll
      - tapOn:
          point: "85%,30%"
      - scroll
      - tapOn:
          point: "50%,60%"

# Phase 4: Rapid taps in common UI areas (50 taps)
- launchApp
- waitForAnimationToEnd

# Rapid taps on top area (toolbar region)
- repeat:
    times: 15
    commands:
      - tapOn:
          point: "20%,8%"
      - tapOn:
          point: "50%,8%"
      - tapOn:
          point: "80%,8%"

# Rapid taps on bottom area (navigation/tabs)
- repeat:
    times: 15
    commands:
      - tapOn:
          point: "20%,92%"
      - tapOn:
          point: "50%,92%"
      - tapOn:
          point: "80%,92%"

# Phase 5: Double taps - rapid succession on same point (30 double-taps)
- launchApp
- waitForAnimationToEnd

- repeat:
    times: 30
    commands:
      # Double tap top-left
      - tapOn:
          point: "20%,15%"
      - tapOn:
          point: "20%,15%"
      # Double tap center
      - tapOn:
          point: "50%,50%"
      - tapOn:
          point: "50%,50%"
      # Double tap bottom-right
      - tapOn:
          point: "80%,85%"
      - tapOn:
          point: "80%,85%"

# Phase 6: Triple taps - test gesture handlers (20 triple-taps)
- launchApp
- waitForAnimationToEnd

- repeat:
    times: 20
    commands:
      # Triple tap top area
      - tapOn:
          point: "30%,10%"
      - tapOn:
          point: "30%,10%"
      - tapOn:
          point: "30%,10%"
      # Triple tap center area
      - tapOn:
          point: "50%,50%"
      - tapOn:
          point: "50%,50%"
      - tapOn:
          point: "50%,50%"
      # Triple tap bottom area
      - tapOn:
          point: "70%,90%"
      - tapOn:
          point: "70%,90%"
      - tapOn:
          point: "70%,90%"

# Phase 7: Mixed rapid taps - double/single/triple pattern (30 mixed patterns)
- launchApp
- waitForAnimationToEnd

- repeat:
    times: 30
    commands:
      # Single tap
      - tapOn:
          point: "40%,40%"
      # Double tap
      - tapOn:
          point: "60%,40%"
      - tapOn:
          point: "60%,40%"
      # Triple tap
      - tapOn:
          point: "40%,60%"
      - tapOn:
          point: "40%,60%"
      - tapOn:
          point: "40%,60%"
      # Single tap
      - tapOn:
          point: "60%,60%"

# Phase 8: Extreme rapid fire - 5 quick taps on same point (20 bursts)
- launchApp
- waitForAnimationToEnd

- repeat:
    times: 20
    commands:
      - tapOn:
          point: "50%,30%"
      - tapOn:
          point: "50%,30%"
      - tapOn:
          point: "50%,30%"
      - tapOn:
          point: "50%,30%"
      - tapOn:
          point: "50%,30%"

# Final verification - app must still respond
- launchApp
- waitForAnimationToEnd
- tapOn:
    point: "50%,50%"
- waitForAnimationToEnd

# Rapid taps on center (content area)
- repeat:
    times: 10
    commands:
      - tapOn:
          point: "30%,30%"
      - tapOn:
          point: "70%,40%"
      - tapOn:
          point: "40%,60%"
      - tapOn:
          point: "60%,70%"

# Final: verify app is still alive
- launchApp
- waitForAnimationToEnd

# Tap center to confirm app responds
- tapOn:
    point: "50%,50%"
- waitForAnimationToEnd
