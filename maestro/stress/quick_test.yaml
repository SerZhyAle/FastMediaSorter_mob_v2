appId: com.sza.fastmediasorter.debug
---
# Quick Stress Test (for validation)
# Duration: ~30 seconds

- launchApp
- waitForAnimationToEnd

# Dismiss permissions
- tapOn:
    text: "Allow"
    optional: true
- waitForAnimationToEnd

# Phase 1: Random taps (10 times)
- repeat:
    times: 10
    commands:
      - tapOn:
          point: "25%,25%"
      - tapOn:
          point: "75%,75%"
      - tapOn:
          point: "50%,50%"

# Phase 2: Navigate
- launchApp
- waitForAnimationToEnd
- tapOn:
    text: "Settings"
    optional: true
- waitForAnimationToEnd

# Phase 3: More taps
- repeat:
    times: 10
    commands:
      - tapOn:
          point: "30%,30%"
      - tapOn:
          point: "70%,70%"

# Done
- launchApp
- waitForAnimationToEnd
