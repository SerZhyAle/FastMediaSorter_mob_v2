appId: com.sza.fastmediasorter.debug
---
# Test: App Lifecycle Torture
# Description: Repeated launch/kill/relaunch to detect memory leaks and state corruption
# Duration: ~3-4 minutes
# Purpose: Process death, state restoration, cold/warm start stability

# Phase 1: Cold start/kill cycles (10 times)
- repeat:
    times: 10
    commands:
      - launchApp
      - waitForAnimationToEnd
      - tapOn:
          text: "Allow"
          optional: true
      - stopApp

# Phase 2: Launch + interact + kill (10 times)
- repeat:
    times: 10
    commands:
      - launchApp
      - waitForAnimationToEnd
      - tapOn:
          point: "30%,30%"
      - tapOn:
          point: "50%,50%"
      - scroll
      - stopApp

# Phase 3: Rapid warm restarts (press Home then relaunch, 15 times)
- launchApp
- waitForAnimationToEnd
- repeat:
    times: 15
    commands:
      - pressKey: Home
      - launchApp    
      - waitForAnimationToEnd

# Phase 4: Launch with deep navigation then kill (5 times)
- repeat:
    times: 5
    commands:
      - launchApp
      - waitForAnimationToEnd
      - tapOn:
          text: "Local"
          optional: true
      - waitForAnimationToEnd
      - scroll
      - tapOn:
          text: ".*"
          index: 0
          optional: true
      - waitForAnimationToEnd
      - stopApp

# Phase 5: Final verification - app should still start cleanly
- launchApp
- waitForAnimationToEnd

# App must still be responsive after 40+ lifecycle events
# Tap center to confirm app responds
- tapOn:
    point: "50%,50%"

# Try basic interaction
- tapOn:
    point: "50%,50%"
- waitForAnimationToEnd
