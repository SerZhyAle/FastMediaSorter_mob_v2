appId: com.sza.fastmediasorter.debug
---
# Test: Lens-Style Translation Overlay
# Description: Verify in-place translation overlay mode
# Duration: ~35 seconds
# Note: Requires internet connection

# Launch app
- launchApp
- waitForAnimationToEnd

# Handle permissions
- runFlow: ../../_shared/permissions.yaml
- waitForAnimationToEnd

# Navigate to local files
- tapOn:
    text: "Local"
    optional: true
- waitForAnimationToEnd

# Find and open image
- scrollUntilVisible:
    element:
      text: ".*\\.(jpg|jpeg|png)$"
    optional: true

- tapOn:
    text: ".*\\.(jpg|jpeg|png)$"
    optional: true
- waitForAnimationToEnd

# Access translation menu
- tapOn:
    id: ".*menu.*"
    optional: true

- tapOn:
    text: ".*[Tt]ranslate.*"
    optional: true
- waitForAnimationToEnd

# Enable lens/overlay mode
- tapOn:
    text: ".*[Ll]ens.*"
    optional: true

- tapOn:
    text: ".*[Oo]verlay.*"
    optional: true
- waitForAnimationToEnd

# Wait for overlay processing
- waitForAnimationToEnd

# Verify overlay translation is displayed
- assertVisible:
    id: ".*overlay.*"
    optional: true

# Close overlay
- tapOn:
    point: "50%, 50%"
- waitForAnimationToEnd

# Close viewer
- back
- waitForAnimationToEnd

# Test completed
