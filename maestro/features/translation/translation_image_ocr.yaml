appId: com.sza.fastmediasorter.debug
---
# Test: Image OCR and Translation
# Description: Verify OCR text extraction and translation from images
# Duration: ~40 seconds
# Note: Requires internet connection

# Launch app
- launchApp
- waitForAnimationToEnd

# Handle permissions
- runFlow: ../../_shared/permissions.yaml
- waitForAnimationToEnd

# Navigate to local files
- tapOn:
    text: "Local"
    optional: true
- waitForAnimationToEnd

# Find image with text
- scrollUntilVisible:
    element:
      text: ".*\\.(jpg|jpeg|png)$"
    optional: true

- tapOn:
    text: ".*\\.(jpg|jpeg|png)$"
    optional: true
- waitForAnimationToEnd

# Access translation/OCR option
- tapOn:
    id: ".*menu.*"
    optional: true

- tapOn:
    text: ".*[Tt]ranslate.*"
    optional: true

- tapOn:
    id: ".*translate.*"
    optional: true
- waitForAnimationToEnd

# Wait for OCR processing (hybrid ML Kit + Tesseract)
- waitForAnimationToEnd

# Verify OCR results displayed
- assertVisible:
    text: ".*[Tt]ext.*"
    optional: true
    timeout: 15000

# Select target language
- tapOn:
    text: ".*[Ll]anguage.*"
    optional: true
- waitForAnimationToEnd

# Select English or another language
- tapOn:
    text: "English"
    optional: true
- waitForAnimationToEnd

# Wait for translation
- waitForAnimationToEnd

# Verify translation displayed
- assertVisible:
    id: ".*translation.*"
    optional: true

# Close translation view
- back
- waitForAnimationToEnd

# Close image viewer
- back
- waitForAnimationToEnd

# Test completed
