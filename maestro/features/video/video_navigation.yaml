appId: com.sza.fastmediasorter.debug
---
# Test: Video Navigation (Next/Previous)
# Description: Verify navigation between videos and autoplay
# Duration: ~35 seconds

# Launch app
- launchApp
- waitForAnimationToEnd

# Handle permissions  
- runFlow: ../../_shared/permissions.yaml
- waitForAnimationToEnd

# Navigate to local files
- tapOn:
    text: "Local"
    optional: true
- waitForAnimationToEnd

# Find and play first video
- scrollUntilVisible:
    element:
      text: ".*\\.(mp4|mkv|avi)$"
    optional: true

- tapOn:
    text: ".*\\.(mp4|mkv|avi)$"
    optional: true
- waitForAnimationToEnd

# Navigate to next video
- tapOn:
    id: ".*next.*"
    optional: true
- waitForAnimationToEnd

# Verify new video playing
- assertVisible:
    id: ".*play.*"
    optional: true

# Navigate to previous video
- tapOn:
    id: ".*previous.*"
    optional: true
- waitForAnimationToEnd

# Test swipe navigation
- swipe:
    direction: LEFT
- waitForAnimationToEnd

# Close video player
- back
- waitForAnimationToEnd

# Test completed
