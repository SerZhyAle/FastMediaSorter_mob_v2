appId: com.sza.fastmediasorter.debug
---
# Test: Video Fullscreen Mode
# Description: Verify fullscreen toggle and orientation changes
# Duration: ~25 seconds

# Launch app
- launchApp
- waitForAnimationToEnd

# Handle permissions
- runFlow: ../../_shared/permissions.yaml
- waitForAnimationToEnd

# Navigate to local files
- tapOn:
    text: "Local"
    optional: true
- waitForAnimationToEnd

# Find and play video
- scrollUntilVisible:
    element:
      text: ".*\\.(mp4|mkv|avi)$"
    optional: true

- tapOn:
    text: ".*\\.(mp4|mkv|avi)$"
    optional: true
- waitForAnimationToEnd

# Toggle fullscreen
- tapOn:
    id: ".*fullscreen.*"
    optional: true
- waitForAnimationToEnd

# Verify fullscreen mode (tap to show controls)
- tapOn:
    point: "50%, 50%"
- waitForAnimationToEnd

# Exit fullscreen
- tapOn:
    id: ".*fullscreen.*"
    optional: true
- waitForAnimationToEnd

# Close video
- back
- waitForAnimationToEnd

# Test completed
