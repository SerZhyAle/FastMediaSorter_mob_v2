appId: com.sza.fastmediasorter.debug
---
# Test: File Move Operation
# Description: Verify file move to destination folder
# Duration: ~30 seconds

# Launch app
- launchApp
- waitForAnimationToEnd

# Handle permissions
- runFlow: ../../_shared/permissions.yaml
- waitForAnimationToEnd

# Navigate to local files
- tapOn:
    text: "Local"
    optional: true
- waitForAnimationToEnd

# Find file to move
- scrollUntilVisible:
    element:
      text: ".*\\.(jpg|jpeg|png)$"
    optional: true

# Open file
- tapOn:
    text: ".*\\.(jpg|jpeg|png)$"
    optional: true
- waitForAnimationToEnd

# Access menu
- tapOn:
    id: ".*menu.*"
    optional: true

- tapOn:
    text: "Move"
    optional: true
- waitForAnimationToEnd

# Select destination
- tapOn:
    index: 0
    optional: true
- waitForAnimationToEnd

# Verify move success
- assertVisible:
    text: ".*[Mm]oved.*"
    optional: true
    timeout: 10000

# Verify file removed from original location
# (Player should move to next file or close)
- waitForAnimationToEnd

# Test completed
