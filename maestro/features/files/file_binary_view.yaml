appId: com.sza.fastmediasorter.debug
---
# Test: Binary Files Viewing
# Description: Verify "All Files" mode with binary file thumbnails and context menu
# Duration: ~30 seconds

# Launch app
- launchApp
- waitForAnimationToEnd

# Handle permissions
- runFlow: ../../_shared/permissions.yaml
- waitForAnimationToEnd

# Navigate to local files
- tapOn:
    text: "Local"
    optional: true
- waitForAnimationToEnd

# Enable "All Files" mode
- tapOn:
    id: ".*menu.*"
    optional: true

- tapOn:
    text: ".*[Aa]ll.*[Ff]iles.*"
    optional: true
- waitForAnimationToEnd

# Find binary file (ZIP, APK, ISO, etc.)
- scrollUntilVisible:
    element:
      text: ".*\\.(zip|rar|apk|iso|exe)$"
    optional: true

# Verify thumbnail with extension is shown
- assertVisible:
    text: ".*\\.(zip|apk).*"
    optional: true

# Long press to open context menu
- longPressOn:
    text: ".*\\.(zip|apk).*"
    optional: true
- waitForAnimationToEnd

# Verify context menu options
- assertVisible:
    text: "Share"
    optional: true

- assertVisible:
    text: ".*[Oo]pen.*[Ww]ith.*"
    optional: true

# Close context menu
- back
- waitForAnimationToEnd

# Test completed
