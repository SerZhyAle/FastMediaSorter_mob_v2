appId: com.sza.fastmediasorter.debug
---
# Test: File Operation Undo
# Description: Verify undo functionality for file operations
# Duration: ~25 seconds

# Launch app
- launchApp
- waitForAnimationToEnd

# Handle permissions
- runFlow: ../../_shared/permissions.yaml
- waitForAnimationToEnd

# Navigate to local files
- tapOn:
    text: "Local"
    optional: true
- waitForAnimationToEnd

# Find file
- scrollUntilVisible:
    element:
      text: ".*\\.(jpg|jpeg|png)$"
    optional: true

# Open file
- tapOn:
    text: ".*\\.(jpg|jpeg|png)$"
    optional: true
- waitForAnimationToEnd

# Perform copy operation
- tapOn:
    id: ".*menu.*"
    optional: true

- tapOn:
    text: "Copy"
    optional: true
- waitForAnimationToEnd

- tapOn:
    index: 0
    optional: true
- waitForAnimationToEnd

# Tap undo button
- tapOn:
    text: "Undo"
    optional: true

- tapOn:
    id: ".*undo.*"
    optional: true
- waitForAnimationToEnd

# Verify undo success
- assertVisible:
    text: ".*[Uu]ndo.*"
    optional: true

# Close viewer
- back
- waitForAnimationToEnd

# Test completed
