appId: com.sza.fastmediasorter.debug
---
# Test: File Rename Operation
# Description: Verify file rename functionality with long press
# Duration: ~30 seconds

# Launch app
- launchApp
- waitForAnimationToEnd

# Handle permissions
- runFlow: ../../_shared/permissions.yaml
- waitForAnimationToEnd

# Navigate to local files
- tapOn:
    text: "Local"
    optional: true
- waitForAnimationToEnd

# Find file to rename
- scrollUntilVisible:
    element:
      text: ".*\\.(jpg|jpeg|png)$"
    optional: true

# Long press on file
- longPressOn:
    text: ".*\\.(jpg|jpeg|png)$"
    optional: true
- waitForAnimationToEnd

# Select rename option
- tapOn:
    text: "Rename"
    optional: true
- waitForAnimationToEnd

# Input new name
- inputText: "renamed_test_image"
- waitForAnimationToEnd

# Confirm rename
- tapOn:
    text: "OK"
    optional: true

- tapOn:
    text: "Save"
    optional: true
- waitForAnimationToEnd

# Verify file renamed
- assertVisible:
    text: "renamed_test_image"
    optional: true

# Test completed
