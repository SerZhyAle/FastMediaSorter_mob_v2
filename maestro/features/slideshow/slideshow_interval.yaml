appId: com.sza.fastmediasorter.debug
---
# Test: Slideshow Interval Settings
# Description: Verify slideshow interval configuration per resource
# Duration: ~40 seconds

# Launch app
- launchApp
- waitForAnimationToEnd

# Navigate to resource settings
- longPressOn:
    text: "Local"
    optional: true
    duration: 1000

# Or access via menu
- tapOn:
    id: ".*menu.*"
    optional: true

- tapOn:
    text: ".*[Ss]ettings.*"
    optional: true
- waitForAnimationToEnd

# Find slideshow interval setting
- scrollUntilVisible:
    element:
      text: ".*[Ss]lideshow.*[Ii]nterval.*"
    optional: true

- tapOn:
    text: ".*[Ss]lideshow.*[Ii]nterval.*"
    optional: true
- waitForAnimationToEnd

# Select 3 seconds
- tapOn:
    text: "3"
    optional: true
- waitForAnimationToEnd

# Save settings
- tapOn:
    text: "Save"
    optional: true

- tapOn:
    text: "OK"
    optional: true
- waitForAnimationToEnd

# Go back to main
- back
    optional: true
- waitForAnimationToEnd

# Start slideshow to verify timing
- tapOn:
    id: ".*slideshow.*"
    optional: true
- waitForAnimationToEnd

# Wait and verify auto-advance (should be ~3s)
- waitForAnimationToEnd

# Stop slideshow
- back
- waitForAnimationToEnd

# Test completed  
