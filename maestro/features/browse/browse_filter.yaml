appId: com.sza.fastmediasorter.debug
---
# Test: Filter the browse listing by name (S0551 Phase 02, matrix 1.2).
# Precondition: seeded IMG_00x_* images + photo_001.jpg in virtual://all_images. No clearState.
# Oracle: after applying name filter "IMG", an IMG_* file is visible and a non-IMG file
#   (photo_001.jpg) is filtered out - proves inclusion AND exclusion. Exact ids/text only.

- launchApp
- runFlow: ../../_shared/permissions.yaml
- runFlow: ../../_shared/go_home.yaml
- assertNotVisible:
    text: "Отправить отчёт о сбое?"

- tapOn:
    text: "Локальные"
    index: 0
- runFlow: ../../_shared/open_all_images.yaml
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/rvMediaFiles"
    timeout: 15000

# Filter by name through the live search overlay.
#
# S2171 moved the name filter out of the extended filter dialog (btnFilter -> dialog_filter.xml,
# which now carries only type, date and size) into an overlay opened by btnSearch. Both write the
# same FileFilter.nameContains, so the oracle below is unchanged; only the input surface moved.
# Measured 2026-09-02: etFilterName exists in no layout and no source file, so the old path could
# never pass again.
- tapOn:
    id: "com.sza.fastmediasorter.debug:id/btnSearch"
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/etSearchQuery"
    timeout: 10000
- tapOn:
    id: "com.sza.fastmediasorter.debug:id/etSearchQuery"
- inputText: "IMG"
# The overlay narrows live on every keystroke - no Apply button. Drop the IME so it does not cover
# the list rows the oracle asserts on.
- hideKeyboard
- waitForAnimationToEnd

# Oracle: IMG_* included, non-IMG (photo_001.jpg) excluded.
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/rvMediaFiles"
    timeout: 10000
- assertVisible:
    text: "IMG_001_green.png"
- assertNotVisible:
    text: "photo_001.jpg"

# Cleanup: closing the overlay clears the query, which resets nameContains - otherwise the narrowed
# listing leaks into every later flow that opens this resource.
- tapOn:
    id: "com.sza.fastmediasorter.debug:id/btnSearchClose"
- waitForAnimationToEnd
