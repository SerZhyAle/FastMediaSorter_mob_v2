appId: com.sza.fastmediasorter.debug
---
# Test: browse sort + empty-state on the Downloads resource (S0551 Phase 02, sort + matrix 15.4).
# Precondition: registered "Загрузки" LOCAL resource (/storage/emulated/0/Download,
#   scanSubdirectories) listing the seeded media as a flat list. No clearState.
# Oracle (a) sort: picking "Дата (Новые)" (DATE_DESC) keeps the listing populated and does not crash.
#   The newest file is a churning log, so the oracle is rvMediaFiles populated + crash guard,
#   not a fixed top filename.
# Oracle (b) empty: a no-match name filter yields emptyStateView + tvEmptyStateMessage.
# Cleanup: clear the filter and restore name-asc sort so the persisted per-resource state
#   does not leak into other flows that open Загрузки.
# Maestro treats `text` as a regex, so literal parentheses in sort-menu labels are escaped.

- launchApp
- runFlow: ../../_shared/permissions.yaml
- runFlow: ../../_shared/go_home.yaml
- assertNotVisible:
    text: "Отправить отчёт о сбое?"

- tapOn:
    text: "Локальные"
    index: 0
- scrollUntilVisible:
    visibilityPercentage: 30
    element:
      text: "Загрузки"
    timeout: 10000
- tapOn:
    text: "Загрузки"
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/rvMediaFiles"
    timeout: 15000

# (a) Sort by newest; the listing stays populated and does not crash.
- tapOn:
    id: "com.sza.fastmediasorter.debug:id/btnSort"
- tapOn:
    text: 'Дата \(Новые\)'
# S1065: let the sort bottom-sheet finish dismissing before asserting the list, so the assert does
# not race the closing sheet still covering rvMediaFiles.
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/rvMediaFiles"
    timeout: 10000
- assertVisible:
    id: "com.sza.fastmediasorter.debug:id/rvMediaFiles"
- assertNotVisible:
    text: "Отправить отчёт о сбое?"

# (b) Empty-state via a no-match name query.
#
# S2171 moved the name filter from the extended filter dialog into the live search overlay
# (btnSearch -> etSearchQuery); dialog_filter.xml keeps only type, date and size. Same
# FileFilter.nameContains underneath, so the empty-state oracle is unchanged.
- tapOn:
    id: "com.sza.fastmediasorter.debug:id/btnSearch"
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/etSearchQuery"
    timeout: 10000
- tapOn:
    id: "com.sza.fastmediasorter.debug:id/etSearchQuery"
- inputText: "zzqq_nomatch_xyz"
# The overlay narrows live - no Apply button. Drop the IME so it does not cover the empty state.
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/emptyStateView"
    timeout: 10000
- assertVisible:
    id: "com.sza.fastmediasorter.debug:id/emptyStateView"
- assertVisible:
    id: "com.sza.fastmediasorter.debug:id/tvEmptyStateMessage"

# Cleanup: closing the overlay clears the query (which resets nameContains) and restoring name-asc
# leaves Загрузки pristine. Both matter - player_documents.yaml and text_viewer_renders.yaml open
# this same resource and scroll down only, so a leaked query or a leaked date sort strands them.
- tapOn:
    id: "com.sza.fastmediasorter.debug:id/btnSearchClose"
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/rvMediaFiles"
    timeout: 10000
- tapOn:
    id: "com.sza.fastmediasorter.debug:id/btnSort"
- tapOn:
    text: 'Имя \(А-Я\)'
