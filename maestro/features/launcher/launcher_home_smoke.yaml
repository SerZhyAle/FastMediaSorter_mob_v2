appId: com.sza.fastmediasorter.debug
---
# Test: Launcher home mode controls smoke test.
# Description: Verifies the primary-window choice and the Launcher Settings entry point in General Settings.
#
# S3024 consolidated the former standalone enable toggle into rowLauncherPrimaryWindow (Home screen /
# In-app Desktop / Resource Manager); rowLauncherModeEnabled exists in no layout since then.
#
# No home role needed: this flow asserts that both controls are PRESENT, never that the settings row
# is active, so it passes with launcher mode off. That is why it carries no `maestro-requires` marker
# while its two neighbours do.

- launchApp
- runFlow: ../../_shared/permissions.yaml
- runFlow: ../../_shared/go_home.yaml

- runFlow: ../../_shared/settings_open_interface.yaml

# Verify General Settings title
- assertVisible:
    id: "com.sza.fastmediasorter.debug:id/titleText"

# Assert presence of the primary-window choice
- assertVisible:
    id: "com.sza.fastmediasorter.debug:id/rowLauncherPrimaryWindow"

# Scroll down to launcher settings row
- scrollUntilVisible:
    visibilityPercentage: 30
    element:
      id: "com.sza.fastmediasorter.debug:id/rowLauncherSettings"
    timeout: 10000

# Assert presence of launcher settings row
- assertVisible:
    id: "com.sza.fastmediasorter.debug:id/rowLauncherSettings"

# Crash guard
- assertNotVisible:
    text: "Отправить отчёт о сбое?"
