appId: com.sza.fastmediasorter.debug
---
# Test: Launcher Settings collapsible sections verification.
# Description: Verifies launcher dialog collapsible headers (Taskbar, Tray, Desktop, System) and controls.

- launchApp
- runFlow: ../../_shared/permissions.yaml
- runFlow: ../../_shared/go_home.yaml

# Open Settings
- tapOn:
    id: "com.sza.fastmediasorter.debug:id/btnSettings"
- runFlow: ../../_shared/dismiss_settings_dialogs.yaml

# Scroll to Interface section header and expand if collapsed
- scrollUntilVisible:
    element:
      id: "com.sza.fastmediasorter.debug:id/headerInterface"
    timeout: 15000

- runFlow:
    when:
      notVisible:
        id: "com.sza.fastmediasorter.debug:id/rowLauncherModeEnabled"
    commands:
      - tapOn:
          id: "com.sza.fastmediasorter.debug:id/headerInterface"
      - waitForAnimationToEnd

# Enable launcher mode toggle if disabled so rowLauncherSettings becomes active
- runFlow:
    when:
      notVisible:
        id: "com.sza.fastmediasorter.debug:id/rowLauncherSettings"
        enabled: true
    commands:
      - tapOn:
          id: "com.sza.fastmediasorter.debug:id/rowLauncherModeEnabled"
      - waitForAnimationToEnd

# Scroll down to launcher settings row
- scrollUntilVisible:
    element:
      id: "com.sza.fastmediasorter.debug:id/rowLauncherSettings"
    timeout: 10000

# Open Launcher Settings dialog
- tapOn:
    id: "com.sza.fastmediasorter.debug:id/rowLauncherSettings"

# Verify collapsible section headers
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/headerLauncherTaskbar"
    timeout: 10000

- scrollUntilVisible:
    element:
      id: "com.sza.fastmediasorter.debug:id/headerLauncherTray"
    timeout: 10000
- assertVisible:
    id: "com.sza.fastmediasorter.debug:id/headerLauncherTray"

- scrollUntilVisible:
    element:
      id: "com.sza.fastmediasorter.debug:id/headerLauncherDesktop"
    timeout: 10000
- assertVisible:
    id: "com.sza.fastmediasorter.debug:id/headerLauncherDesktop"

# Close dialog
- tapOn:
    id: "com.sza.fastmediasorter.debug:id/btnClose"

# Crash guard
- assertNotVisible:
    text: "Отправить отчёт о сбое?"
