appId: com.sza.fastmediasorter.debug
---
# maestro-requires: home-role
# Test: Launcher Settings dialog open and close round-trip.
# Description: Opens Launcher Settings dialog from General Settings and verifies headers and Apply button.
#
# Requires the ROLE_HOME system role: the Launcher Settings row is only active while this app holds
# it. _shared/launcher_mode_enable.yaml takes the role through the system dialog; maestro/run-tests.ps1
# reads the marker above, gates the grant per device and restores the previous holder afterwards.

- launchApp
- runFlow: ../../_shared/permissions.yaml
- runFlow: ../../_shared/go_home.yaml

- runFlow: ../../_shared/settings_open_interface.yaml
- runFlow: ../../_shared/launcher_mode_enable.yaml

# Open Launcher Settings dialog
- tapOn:
    id: "com.sza.fastmediasorter.debug:id/rowLauncherSettings"

# Verify dialog header and close/apply button
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/btnClose"
    timeout: 10000

- assertVisible:
    id: "com.sza.fastmediasorter.debug:id/headerLauncherTaskbar"

# Close dialog
- tapOn:
    id: "com.sza.fastmediasorter.debug:id/btnClose"

# Verify returning to General Settings
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/rowLauncherSettings"
    timeout: 8000

# Crash guard
- assertNotVisible:
    text: "Отправить отчёт о сбое?"
