appId: com.sza.fastmediasorter.debug
---
# Test: Audio playback with lyrics viewer (S0551 Phase 04).
# Precondition: clean preparation exposes the standard "Загрузки" LOCAL resource and seeds
#   Audio/frank_sinatra_My_way.mp3 with a sibling .lrc file.
# Oracle: audio controls render, lyrics command opens lyricsViewerContainer.

- launchApp
- runFlow: ../../_shared/permissions.yaml
- runFlow: ../../_shared/go_home.yaml
- assertNotVisible:
    text: "Отправить отчёт о сбое?"

- tapOn:
    text: "Локальные"
    index: 0
- scrollUntilVisible:
    visibilityPercentage: 30
    element:
      text: "Загрузки"
    timeout: 10000
- tapOn:
    text: "Загрузки"
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/rvMediaFiles"
    timeout: 15000
- runFlow: ../../_shared/downloads_sort_reset.yaml

# Centre the row before the open tap: scrolled to the bottom edge the row is only partly on-screen
# and the row-container tap can miss; centring places it mid-list so containsChild taps cleanly.
- scrollUntilVisible:
    element:
      text: "frank_sinatra_My_way.mp3"
    timeout: 40000
    visibilityPercentage: 30
    centerElement: true
    waitToSettleTimeoutMs: 600
# Open by tapping the row container (clear of the right-side operation buttons), matched by the exact
# filename - a centred filename-text tap lands on a button (see player_image.yaml).
- tapOn:
    containsChild:
      text: "frank_sinatra_My_way.mp3"
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/btnPlaybackControl"
    timeout: 20000
- tapOn:
    id: "com.sza.fastmediasorter.debug:id/playerView"
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/btnLyricsCmd"
    timeout: 8000
- tapOn:
    id: "com.sza.fastmediasorter.debug:id/btnLyricsCmd"
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/lyricsViewerContainer"
    timeout: 20000
- assertVisible:
    id: "com.sza.fastmediasorter.debug:id/tvLyricsContent"
- assertNotVisible:
    text: "Отправить отчёт о сбое?"
