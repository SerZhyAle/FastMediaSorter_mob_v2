appId: com.sza.fastmediasorter.debug
---
# Test: Open and control video playback (S0551 Phase 04).
# Precondition: clean preparation exposes the standard "Загрузки" LOCAL resource and seeds
#   video_sample.mp4 under /storage/emulated/0/Download.
# Oracle: playerView renders, the play/pause control (btnPlaybackControl) is available, and
#   no crash prompt appears.

- launchApp
- runFlow: ../../_shared/permissions.yaml
- runFlow: ../../_shared/go_home.yaml
- assertNotVisible:
    text: "Отправить отчёт о сбое?"

- tapOn:
    text: "Локальные"
    index: 0
- scrollUntilVisible:
    element:
      text: "Загрузки"
    timeout: 10000
- tapOn:
    text: "Загрузки"
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/rvMediaFiles"
    timeout: 15000
- runFlow: ../../_shared/downloads_sort_reset.yaml

# The Загрузки listing is a flat, name-sorted set of ~48 files, so videos sit at the very bottom;
# the last row is partially clipped by the bottom bar/FAB and never reaches 100% visibility. Lower
# the visibility threshold, let the RecyclerView settle between scrolls, and centre the found row so
# the deep tail items are reliably reached (default speed avoids overshooting the last row).
- scrollUntilVisible:
    element:
      text: "video_sample.mp4"
    timeout: 40000
    visibilityPercentage: 30
    centerElement: true
    waitToSettleTimeoutMs: 600
# Open by tapping the row container, not the filename text: tvFileName is constrained end-to-parent
# so its node centre (x=675 on 1080px) sits over the right-side operation buttons (favorite/copy/..
# start at x=607), and a centred text tap lands on a button. The row root is clickable, opens the
# file, and its centre (x=540) is clear of the buttons; containsChild matches it by the exact filename.
- tapOn:
    containsChild:
      text: "video_sample.mp4"
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/playerView"
    timeout: 20000
- assertVisible:
    id: "com.sza.fastmediasorter.debug:id/playerView"
# Reveal the Media3 controller overlay (custom_player_controls*); its play/pause button id is
# btnPlaybackControl (the unified player has no btnPlayPause). A single tap races the controller
# auto-hide: if it lands while the overlay is still showing it hides it, so the button stays absent
# (S1065). Tap, then re-tap only if the control is still not shown, ending revealed either way.
- tapOn:
    id: "com.sza.fastmediasorter.debug:id/playerView"
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "com.sza.fastmediasorter.debug:id/btnPlaybackControl"
    commands:
      - tapOn:
          id: "com.sza.fastmediasorter.debug:id/playerView"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/btnPlaybackControl"
    timeout: 8000
- tapOn:
    id: "com.sza.fastmediasorter.debug:id/btnPlaybackControl"
- assertNotVisible:
    text: "Отправить отчёт о сбое?"
