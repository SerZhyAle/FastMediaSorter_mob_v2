appId: com.sza.fastmediasorter.debug
---
# Test: Open a large image in the player - S0550 regression (S0551 Phase 04).
# Precondition: seeded photo_001.jpg (4032x2268) indexed in virtual://all_images.
# Oracle: the image surface (photoView) renders and no crash-report prompt appears -
#   this is the deterministic regression for S0550 (player crash on large image open).
# No clearState (preserve the MediaStore-backed listing); element-only oracle (image has
# no completion log marker).

- launchApp
- runFlow: ../../_shared/permissions.yaml
- runFlow: ../../_shared/go_home.yaml
- assertNotVisible:
    text: "Отправить отчёт о сбое?"

- tapOn:
    text: "Локальные"
    index: 0
- runFlow: ../../_shared/open_all_images.yaml
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/rvMediaFiles"
    timeout: 15000

# Open the large image that crashed in S0550. Tap the row container, not the filename text:
# tvFileName is constrained end-to-parent so its node centre (x=675 on 1080px) falls behind the
# right-side operation buttons (favorite/copy/.. start at x=607) and a centred text tap lands on a
# button. The row root is clickable, opens the file, and its centre (x=540) is clear of the buttons;
# containsChild matches that row by the exact filename (leftOf matched a wrong row's thumbnail).
- tapOn:
    containsChild:
      text: "photo_001.jpg"
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/photoView"
    timeout: 15000
- assertVisible:
    id: "com.sza.fastmediasorter.debug:id/photoView"
# Crash guard: no crash-report prompt surfaced from the open.
- assertNotVisible:
    text: "Отправить отчёт о сбое?"
