appId: com.sza.fastmediasorter.debug
---
# Test: Document renderers for PDF, EPUB, and TXT (S0551 Phase 04).
# Precondition: setup_test_media.ps1 has seeded Docs/test_doc_romcom.pdf, test_book.epub and
#   readme.txt; the shared fragment registers that folder as a resource.
# Oracle: each document-specific surface renders and no crash prompt appears. The default PDF
#   view mode is page mode, which renders the page into photoView (pdfScrollRecyclerView is only
#   inflated in scroll mode); EPUB uses epubWebView; TXT renders inside mediaContentArea.
#
# S2369: the documents are reached through a resource connected with the system picker, not through
# the raw-path "Загрузки" one this flow used until 2026-09-02. On a store build MediaProvider strips
# every document row out of a raw path before the app sees the cursor, so all three files are absent
# there rather than merely far down the list. The SAF branch of the scanner reads the folder whole.

- launchApp
- runFlow: ../../_shared/permissions.yaml
- runFlow: ../../_shared/add_saf_docs_resource.yaml
- assertNotVisible:
    text: "Отправить отчёт о сбое?"

- tapOn:
    text: "Docs"
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/rvMediaFiles"
    timeout: 15000

# Four files in the folder, so every row is on screen without scrolling. Open by tapping the row
# container (clear of the right-side operation buttons), matched by the exact filename - a centred
# filename-text tap lands on a button (see player_image.yaml).
- extendedWaitUntil:
    visible:
      text: "test_doc_romcom.pdf"
    timeout: 20000
- tapOn:
    containsChild:
      text: "test_doc_romcom.pdf"
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/photoView"
    timeout: 20000
- assertVisible:
    id: "com.sza.fastmediasorter.debug:id/photoView"
- assertNotVisible:
    text: "Отправить отчёт о сбое?"
- back

- extendedWaitUntil:
    visible:
      text: "test_book.epub"
    timeout: 20000
- tapOn:
    containsChild:
      text: "test_book.epub"
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/epubWebView"
    timeout: 20000
- assertVisible:
    id: "com.sza.fastmediasorter.debug:id/epubWebView"
- assertNotVisible:
    text: "Отправить отчёт о сбое?"
- back

- extendedWaitUntil:
    visible:
      text: "readme.txt"
    timeout: 20000
- tapOn:
    containsChild:
      text: "readme.txt"
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/mediaContentArea"
    timeout: 15000
- assertVisible:
    id: "com.sza.fastmediasorter.debug:id/mediaContentArea"
- assertNotVisible:
    text: "Отправить отчёт о сбое?"

