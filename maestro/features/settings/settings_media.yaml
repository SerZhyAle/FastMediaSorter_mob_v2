appId: com.sza.fastmediasorter.debug
---
# Test: Media Settings with Grouped Sections
# Description: Verify Media Settings collapsible groups and cache configuration
# Duration: ~35 seconds

# Launch app
- launchApp
- waitForAnimationToEnd

# Navigate to Settings
- tapOn:
    text: "Settings"
    optional: true
- waitForAnimationToEnd

# Navigate to Media tab
- tapOn:
    text: "Media"
    optional: true
- waitForAnimationToEnd

# Expand cache settings section
- tapOn:
    text: ".*[Cc]ache.*"
    optional: true
- waitForAnimationToEnd

# View cache size setting
- assertVisible:
    text: ".*[Cc]ache.*[Ss]ize.*"
    optional: true

# Expand metadata section
- tapOn:
    text: ".*[Mm]etadata.*"
    optional: true
- waitForAnimationToEnd

# Test two-stage video metadata option
- tapOn:
    text: ".*[Vv]ideo.*[Mm]etadata.*"
    optional: true
- waitForAnimationToEnd

# Scroll to view more options
- scroll
- waitForAnimationToEnd

# Close settings
- back
- waitForAnimationToEnd

# Test completed
