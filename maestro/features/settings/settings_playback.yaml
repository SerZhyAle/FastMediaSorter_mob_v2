appId: com.sza.fastmediasorter.debug
---
# Test: Playback Settings
# Description: Verify Playback Settings grouped options
# Duration: ~30 seconds

# Launch app
- launchApp
- waitForAnimationToEnd

# Navigate to Settings
- tapOn:
    text: "Settings"
    optional: true
- waitForAnimationToEnd

# Navigate to Playback tab
- tapOn:
    text: "Playback"
    optional: true
- waitForAnimationToEnd

# Test autoplay option
- tapOn:
    text: ".*[Aa]utoplay.*"
    optional: true
- waitForAnimationToEnd

# Test repeat mode
- tapOn:
    text: ".*[Rr]epeat.*"
    optional: true
- waitForAnimationToEnd

# Expand video playback section
- tapOn:
    text: ".*[Vv]ideo.*"
    optional: true
- waitForAnimationToEnd

# Close settings
- back
- waitForAnimationToEnd

# Test completed
