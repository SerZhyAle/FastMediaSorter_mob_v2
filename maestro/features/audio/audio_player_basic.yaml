appId: com.sza.fastmediasorter.debug
---
# Test: Audio Player Basic Controls
# Description: Verify basic audio playback controls (play/pause/next/previous/volume)
# Duration: ~30 seconds

# Launch app
- launchApp
- waitForAnimationToEnd

# Handle permissions
- runFlow: ../../_shared/permissions.yaml
- waitForAnimationToEnd

# Navigate to local files
- tapOn:
    text: "Local"
    optional: true
- waitForAnimationToEnd

# Find and play audio file
- scrollUntilVisible:
    element:
      text: ".*\\.(mp3|flac|aac|ogg|m4a|wma|opus)$"
    timeout: 15000
    optional: true

- tapOn:
    text: ".*\\.(mp3|flac|aac|ogg|m4a)$"
    optional: true

# Wait for player to open
- waitForAnimationToEnd

# Verify player UI is visible
- assertVisible:
    id: ".*play.*"
    optional: true

# Test play/pause toggle
- tapOn:
    id: ".*play.*"
    optional: true
- waitForAnimationToEnd

# Test play again
- tapOn:
    id: ".*play.*"
    optional: true
- waitForAnimationToEnd

# Test next track button
- tapOn:
    id: ".*next.*"
    optional: true
- waitForAnimationToEnd

# Test previous track button
- tapOn:
    id: ".*previous.*"
    optional: true
- waitForAnimationToEnd

# Test volume control visibility
- assertVisible:
    id: ".*volume.*"
    optional: true

# Close player
- back
- waitForAnimationToEnd

# Test completed successfully
