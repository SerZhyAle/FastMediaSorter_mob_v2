appId: com.sza.fastmediasorter.debug
---
# Test: Audio Player with Photo Background
# Description: Verify photo background displays while playing music
# Duration: ~30 seconds

# Launch app
- launchApp
- waitForAnimationToEnd

# Handle permissions
- runFlow: ../../_shared/permissions.yaml
- waitForAnimationToEnd

# Navigate to audio file
- tapOn:
    text: "Local"
    optional: true
- waitForAnimationToEnd

# Find and play audio
- scrollUntilVisible:
    element:
      text: ".*\\.(mp3|flac|m4a)$"
    optional: true

- tapOn:
    text: ".*\\.(mp3|flac|m4a)$"
    optional: true
- waitForAnimationToEnd

# Look for photo background option
- tapOn:
    id: ".*menu.*"
    optional: true

- tapOn:
    text: ".*[Pp]hoto.*[Bb]ackground.*"
    optional: true
- waitForAnimationToEnd

# Select an image
- tapOn:
    text: ".*\\.(jpg|jpeg|png)$"
    optional: true
- waitForAnimationToEnd

# Verify background is set
- assertVisible:
    id: ".*background.*"
    optional: true

# Close player
- back
- waitForAnimationToEnd

# Test completed
