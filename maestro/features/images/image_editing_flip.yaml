appId: com.sza.fastmediasorter.debug
---
# Test: Image Editing - Flip
# Description: Verify horizontal and vertical flip functionality
# Duration: ~25 seconds

# Launch app
- launchApp
- waitForAnimationToEnd

# Handle permissions
- runFlow: ../../_shared/permissions.yaml
- waitForAnimationToEnd

# Navigate to local files
- tapOn:
    text: "Local"
    optional: true
- waitForAnimationToEnd

# Find and open image
- scrollUntilVisible:
    element:
      text: ".*\\.(jpg|jpeg|png)$"
    optional: true

- tapOn:
    text: ".*\\.(jpg|jpeg|png)$"
    optional: true
- waitForAnimationToEnd

# Open edit menu
- tapOn:
    text: "Edit"
    optional: true

- tapOn:
    id: ".*edit.*"
    optional: true
- waitForAnimationToEnd

# Flip horizontal
- tapOn:
    text: ".*[Ff]lip.*[Hh]orizontal.*"
    optional: true

- tapOn:
    id: ".*flip.*horizontal.*"
    optional: true
- waitForAnimationToEnd

# Flip vertical
- tapOn:
    text: ".*[Ff]lip.*[Vv]ertical.*"
    optional: true

- tapOn:
    id: ".*flip.*vertical.*"
    optional: true
- waitForAnimationToEnd

# Save changes
- tapOn:
    text: "Save"
    optional: true
- waitForAnimationToEnd

# Close viewer
- back
- waitForAnimationToEnd

# Test completed
