appId: com.sza.fastmediasorter.debug
---
# Test: Image Brightness/Contrast/Saturation Adjustments
# Description: Verify adjustment controls for brightness, contrast, and saturation
# Duration: ~40 seconds

# Launch app
- launchApp
- waitForAnimationToEnd

# Handle permissions
- runFlow: ../../_shared/permissions.yaml
- waitForAnimationToEnd

# Navigate to local files
- tapOn:
    text: "Local"
    optional: true
- waitForAnimationToEnd

# Find and open image
- scrollUntilVisible:
    element:
      text: ".*\\.(jpg|jpeg|png)$"
    optional: true

- tapOn:
    text: ".*\\.(jpg|jpeg|png)$"
    optional: true
- waitForAnimationToEnd

# Open edit menu
- tapOn:
    text: "Edit"
    optional: true

- tapOn:
    id: ".*adjust.*"
    optional: true
- waitForAnimationToEnd

# Adjust brightness
- tapOn:
    text: ".*[Bb]rightness.*"
    optional: true
- waitForAnimationToEnd

# Move slider (tap right side to increase)
- tapOn:
    point: "70%, 50%"
    optional: true
- waitForAnimationToEnd

# Adjust contrast
- tapOn:
    text: ".*[Cc]ontrast.*"
    optional: true
- waitForAnimationToEnd

- tapOn:
    point: "70%, 50%"
    optional: true
- waitForAnimationToEnd

# Adjust saturation
- tapOn:
    text: ".*[Ss]aturation.*"
    optional: true
- waitForAnimationToEnd

- tapOn:
    point: "70%, 50%"
    optional: true
- waitForAnimationToEnd

# Save changes
- tapOn:
    text: "Save"
    optional: true
- waitForAnimationToEnd

# Close viewer
- back
- waitForAnimationToEnd

# Test completed
