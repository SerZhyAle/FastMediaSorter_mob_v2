appId: com.sza.fastmediasorter.debug
---
# Test: 3D Mode Switching - Toggle between Auto / Force SBS / Mono
# Feature: 3D Video Support (SBS)
# Duration: ~60 seconds
# Precondition 1: A test SBS video (aspect ratio ~32:9, e.g. 3840x1080) must be present at
#                 /sdcard/TestMedia/3D-SBS-Test.mkv - run scripts/utils/setup_test_media.ps1 first.
# Precondition 2: a build whose playback-control dialog offers the 3D section. That section is gated
#                 by supportsVrMediaControls and by the user's 3D/VR master toggle, so install the
#                 noLegal debug build (.\a.ps1 ivn) and leave the toggle on.
#
# S1618: this flow used to drive a "Playback Settings" dialog no code could open, through regex
# selectors that silently never fired. The 3D choice lives in the playback-control dialog, opened by
# btnPlaybackControl. Selecting a mode applies it immediately and leaves the dialog open, so all
# three switches happen in one visit instead of reopening the dialog each time.

- launchApp
- waitForAnimationToEnd

- runFlow: ../_shared/permissions.yaml
- waitForAnimationToEnd

# Navigate to the Local tab
- tapOn:
    text: "Local"
    optional: true
- waitForAnimationToEnd

# Navigate into the TestMedia folder
- tapOn:
    text: "TestMedia"
    optional: true
- waitForAnimationToEnd

# Open the SBS test video
- tapOn:
    text: "3D-SBS-Test"
- waitForAnimationToEnd

# Open the playback-control dialog on its 3D section
- tapOn:
    id: "btnPlaybackControl"
- waitForAnimationToEnd
- tapOn:
    id: "btnSectionStereo"
- waitForAnimationToEnd

# --- Force SBS ---

- assertVisible:
    text: "Side-by-Side (SBS)"
- tapOn:
    id: "radio3DSbs"
- waitForAnimationToEnd

# The dialog stays open and keeps naming the chosen format.
- assertVisible:
    text: "Side-by-Side (SBS)"
- assertNotVisible:
    text: "has stopped"
- assertNotVisible:
    text: "Unfortunately"

# --- Force Mono ---

- assertVisible:
    text: "Mono (Disabled)"
- tapOn:
    id: "radio3DMono"
- waitForAnimationToEnd

- assertNotVisible:
    text: "has stopped"
- assertNotVisible:
    text: "Unfortunately"
# Proof assertion, so it is not optional: an optional error guard passes either way.
- assertNotVisible:
    text: "Error"

# --- Back to Auto ---

- assertVisible:
    text: "Auto-detect"
- tapOn:
    id: "radio3DAuto"
- waitForAnimationToEnd

- tapOn:
    id: "btnClosePlaybackControl"
- waitForAnimationToEnd

# Final stability check
- assertNotVisible:
    text: "has stopped"
- assertNotVisible:
    text: "Unfortunately"
