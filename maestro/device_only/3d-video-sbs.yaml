appId: com.sza.fastmediasorter.debug
---
# Test: 3D SBS Video - Basic Playback & Auto-Detection
# Feature: 3D Video Support (SBS)
# Duration: ~45 seconds
# Precondition 1: A test SBS video (aspect ratio ~32:9, e.g. 3840x1080) must be present at
#                 /sdcard/TestMedia/3D-SBS-Test.mkv - run scripts/utils/setup_test_media.ps1 first.
# Precondition 2: a build whose playback-control dialog offers the 3D section. That section is gated
#                 by supportsVrMediaControls and by the user's 3D/VR master toggle, so install the
#                 noLegal debug build (.\a.ps1 ivn) and leave the toggle on.
#
# S1618: this flow used to drive a "Playback Settings" dialog no code could open, through regex
# selectors that silently never fired. The 3D choice lives in the playback-control dialog, opened by
# btnPlaybackControl, and the steps below name its real ids. No tap is needed to reveal the player
# controls: the unified player sets an effectively infinite show timeout and hide_on_touch=false.

- launchApp
- waitForAnimationToEnd

- runFlow: ../_shared/permissions.yaml
- waitForAnimationToEnd

# Navigate to the Local tab
- tapOn:
    text: "Local"
    optional: true
- waitForAnimationToEnd

# Navigate into the TestMedia folder
- tapOn:
    text: "TestMedia"
    optional: true
- waitForAnimationToEnd

# Open the SBS test video
- tapOn:
    text: "3D-SBS-Test"
- waitForAnimationToEnd

# Open the playback-control dialog
- tapOn:
    id: "btnPlaybackControl"
- waitForAnimationToEnd

# Open its 3D section
- tapOn:
    id: "btnSectionStereo"
- waitForAnimationToEnd

# The flat 3D formats must all be offered, and the section must name what it overrides.
- assertVisible:
    text: "Override format type"
- assertVisible:
    text: "Auto-detect"
- assertVisible:
    text: "Side-by-Side (SBS)"
- assertVisible:
    text: "Mono (Disabled)"

# Close the dialog
- tapOn:
    id: "btnClosePlaybackControl"
- waitForAnimationToEnd

# Verify the player is still running (no crash)
- assertNotVisible:
    text: "has stopped"
- assertNotVisible:
    text: "Unfortunately"

# Verify no error message is shown. This is a proof assertion, so it is not optional:
# an optional crash/error guard passes whether or not the error was there.
- assertNotVisible:
    text: "Error"
