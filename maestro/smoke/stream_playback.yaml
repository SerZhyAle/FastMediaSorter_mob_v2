appId: com.sza.fastmediasorter.debug
# real-hardware: plays an HLS stream through the hardware decoder. On the CI emulator (software GPU) the
# H.264 decode lost the GPU context and the emulator died mid-run, taking the next flow down with it.
# .github/workflows/maestro-tests.yml excludes this tag; the pre-release sweep plays it on a real device.
tags:
  - real-hardware
env:
  STREAM_URL: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
  STREAM_TITLE: "Maestro HLS playback"
---
# Regression: the Streams screen and player can open while streaming is broken.
# Requires Internet and the ru locale, like the other phone smoke flows.
# Use a fixed HLS fixture instead of a catalog channel whose URL can expire.
# Oracle: the player reaches READY with playWhenReady set and stays there. A list stream runs the
# live-video control profile (S0631/S0641), which removes exo_position from the screen, so the
# timeline cannot be read; the pause action on the play/pause button plus no buffering indicator is
# the state that profile keeps.
# Reuse the fixture on subsequent runs; never clear the device's stream catalog.
# Advisory: the fixture is an external host, so a failure without an app crash does not block a
# release (owner decision 2026-10-14, S4249); scripts/devtest/prerelease-verdict.ps1 reads the token.
# maestro-advisory: network

- launchApp
- runFlow: ../_shared/permissions.yaml
- runFlow: ../_shared/go_home.yaml
- tapOn:
    id: "com.sza.fastmediasorter.debug:id/btnSettings"
- runFlow: ../_shared/dismiss_settings_dialogs.yaml
- tapOn:
    text: "Медиа"
- scrollUntilVisible:
    element:
      id: "com.sza.fastmediasorter.debug:id/headerStreams"
    visibilityPercentage: 30
    timeout: 15000
- runFlow:
    when:
      notVisible:
        id: "com.sza.fastmediasorter.debug:id/rowEnableStreams"
    commands:
      - tapOn:
          id: "com.sza.fastmediasorter.debug:id/headerStreams"
- scrollUntilVisible:
    element:
      id: "com.sza.fastmediasorter.debug:id/rowEnableStreams"
    visibilityPercentage: 30
    timeout: 15000
- runFlow:
    when:
      visible:
        id: "com.sza.fastmediasorter.debug:id/rowEnableStreams"
        containsChild:
          id: "com.sza.fastmediasorter.debug:id/str_switch"
          checked: false
    commands:
      - tapOn:
          id: "com.sza.fastmediasorter.debug:id/rowEnableStreams"
- runFlow: ../_shared/go_home.yaml
- tapOn:
    id: "com.sza.fastmediasorter.debug:id/btnMainDropdownMenu"
- tapOn:
    text: "Трансляции"
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/etSearch"
    timeout: 15000
# A manual entry is listed only under the "own" facet or with no facet lit; the Video facet hides
# every manual row. The facet buttons toggle and the choice persists, so tapping "own" leaves the
# fixture visible from any starting state (none lit -> own lit, own lit -> cleared).
- tapOn:
    id: "com.sza.fastmediasorter.debug:id/btnMediaKindOwn"
- tapOn:
    id: "com.sza.fastmediasorter.debug:id/etSearch"
- inputText: ${STREAM_TITLE}
- hideKeyboard
- waitForAnimationToEnd
# The title is also the text of the search field, so every title check below is pinned to the list
# row's own id; matching on text alone is satisfied by the search field and skips adding the fixture.
- runFlow:
    when:
      notVisible:
        id: "com.sza.fastmediasorter.debug:id/tvTitle"
        text: ${STREAM_TITLE}
    commands:
      # AppCompat's overflow description follows the system locale.
      - runFlow:
          when:
            visible: "More options"
          commands:
            - tapOn: "More options"
      - runFlow:
          when:
            visible: "Ещё"
          commands:
            - tapOn: "Ещё"
      - runFlow:
          when:
            visible: "Другие параметры"
          commands:
            - tapOn: "Другие параметры"
      - tapOn:
          text: "Добавить трансляцию"
      - tapOn:
          id: "com.sza.fastmediasorter.debug:id/etUrl"
      - inputText: ${STREAM_URL}
      - tapOn:
          id: "com.sza.fastmediasorter.debug:id/etTitle"
      - inputText: ${STREAM_TITLE}
      - hideKeyboard
      - tapOn:
          id: "android:id/button1"
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/tvTitle"
      text: ${STREAM_TITLE}
    timeout: 15000
- tapOn:
    id: "com.sza.fastmediasorter.debug:id/tvTitle"
    text: ${STREAM_TITLE}
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/playerView"
    timeout: 30000
# The first player open after an install covers the screen with a touch-zone hint that closes on a
# tap and hides the controller behind it; the app persists the dismissal, so later runs skip it.
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      visible:
        id: "com.sza.fastmediasorter.debug:id/tvFirstRunHintText"
    commands:
      - tapOn:
          id: "com.sza.fastmediasorter.debug:id/tvFirstRunHintText"
# One tap on the surface reveals a hidden controller and never toggles it off (hide_on_touch is
# false), so the check does not pause playback.
- runFlow:
    when:
      notVisible:
        id: "com.sza.fastmediasorter.debug:id/exo_play_pause"
    commands:
      - tapOn:
          id: "com.sza.fastmediasorter.debug:id/playerView"
# The button names its pause action while the player is playing or buffering; buffering is the
# second condition below, so a stalled stream does not pass on the first one alone.
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/exo_play_pause"
      text: "Приостановить"
    timeout: 30000
- extendedWaitUntil:
    notVisible:
      id: "com.sza.fastmediasorter.debug:id/exo_buffering"
    timeout: 20000
# Frames keep arriving: the same state again after the stream had time to stall or end. The
# controller may have auto-hidden meanwhile, so reveal it before reading.
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      notVisible:
        id: "com.sza.fastmediasorter.debug:id/exo_play_pause"
    commands:
      - tapOn:
          id: "com.sza.fastmediasorter.debug:id/playerView"
- assertVisible:
    id: "com.sza.fastmediasorter.debug:id/exo_play_pause"
    text: "Приостановить"
- assertNotVisible:
    id: "com.sza.fastmediasorter.debug:id/exo_buffering"
- assertNotVisible:
    text: "Отправить отчёт о сбое?"
- back
- assertVisible:
    id: "com.sza.fastmediasorter.debug:id/etSearch"
- runFlow: ../_shared/go_home.yaml
