appId: com.sza.fastmediasorter.debug
---
# Test: File Operations (Copy)
# Objective: Verify copy, move, delete operations
# Duration: ~50 seconds

- launchApp

- waitForAnimationToEnd

# Navigate to Browse tab
- assertVisible:
    id: ".*:id/browse_tab"

- tapOn:
    id: ".*:id/browse_tab"

- waitForAnimationToEnd

# Verify file list
- assertVisible:
    id: ".*:id/file_list"

# Scroll to find a file
- scroll

- waitForAnimationToEnd

# Long-tap file to open context menu
- longPressOn:
    index: 0
    optional: true

- waitForAnimationToEnd

# Verify context menu appeared
- assertVisible:
    text: "Copy"
    optional: true

# Tap Copy option
- tapOn:
    text: "Copy"
    optional: true

- waitForAnimationToEnd

# Navigate to a different folder (for paste destination)
- tapOn:
    index: 1
    optional: true

- waitForAnimationToEnd

# Look for paste option or icon
- assertVisible:
    text: "Paste"
    optional: true

# Try pasting (long-tap to bring up menu or tap paste icon)
- tapOn:
    id: ".*:id/paste_button"
    optional: true

- tapOn:
    text: "Paste"
    optional: true

- waitForAnimationToEnd

# Verify operation completed (check for confirmation or verify file appears)
- assertVisible:
    id: ".*:id/file_list"
    optional: true

# Try Move operation (if available)
- longPressOn:
    index: 0
    optional: true

- waitForAnimationToEnd

- tapOn:
    text: "Move"
    optional: true

- waitForAnimationToEnd

# Try Delete operation (if available)
- longPressOn:
    index: 0
    optional: true

- waitForAnimationToEnd

- tapOn:
    text: "Delete"
    optional: true

- waitForAnimationToEnd

# Confirm deletion if dialog appears
- tapOn:
    text: "Confirm"
    optional: true

- tapOn:
    text: "Yes"
    optional: true

- tapOn:
    text: "OK"
    optional: true

- waitForAnimationToEnd

# Verify we're still in file list
- assertVisible:
    id: ".*:id/file_list"
