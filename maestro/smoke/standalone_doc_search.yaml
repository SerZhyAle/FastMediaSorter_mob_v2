appId: com.sza.fastmediasorter.debug
---
# Test: Standalone PDF Search
# Description: Verify PDF search panel works when opened via "Open With" (StandalonePlayerActivity)
# Duration: ~40 seconds
# Requirements: device with test_media/sample.pdf on /sdcard/test_media/

- launchApp:
    appId: com.sza.fastmediasorter.debug
    arguments:
      action: android.intent.action.VIEW
      uri: "file:///sdcard/test_media/sample.pdf"
      mimeType: "application/pdf"
- waitForAnimationToEnd

- setOrientation:
    orientation: landscape_left
- waitForAnimationToEnd

- tapOn:
    id: btnSearchPdfCmd
- assertVisible:
    id: searchPanel
- inputText: "chapter"
- assertVisible:
    id: tvSearchCounter
- tapOn:
    id: btnCloseSearch
- assertNotVisible:
    id: searchPanel

- back
- waitForAnimationToEnd

# Reset orientation
- setOrientation:
    orientation: portrait
