appId: com.sza.fastmediasorter.debug
---
# Test: Image Viewing (Resilient)
# Description: Verify image viewing functionality
# Duration: ~40 seconds

# Launch app
- launchApp
- waitForAnimationToEnd

- runFlow: ../_shared/permissions.yaml
- waitForAnimationToEnd

# Try to go to Local tab
- tapOn:
    text: "Local"
    optional: true
- waitForAnimationToEnd

# Try to find an image file
- scrollUntilVisible:
    element:
      text: ".*\\.(jpg|jpeg|png|gif|webp)$"
    optional: true

# Tap on image to open viewer
- tapOn:
    text: ".*\\.(jpg|jpeg|png|gif|webp)$"
    optional: true

# Wait for image viewer
- waitForAnimationToEnd

# Verify image area is present (flexible)
- assertVisible:
    id: ".*image.*"
    optional: true

# Tap center of screen (image interaction)
- tapOn:
    point: "50%, 50%"
- waitForAnimationToEnd

# Try edit/menu options
- tapOn:
    id: ".*menu.*"
    optional: true
- tapOn:
    id: ".*more.*"
    optional: true
- tapOn:
    text: "Edit"
    optional: true
- tapOn:
    text: "Rotate"
    optional: true
- waitForAnimationToEnd

# Close viewer
- back
- waitForAnimationToEnd
- back
- waitForAnimationToEnd

# Verify app is alive
- tapOn:
    point: "50%,50%"
- waitForAnimationToEnd

# Test passed: Image viewing is functional
