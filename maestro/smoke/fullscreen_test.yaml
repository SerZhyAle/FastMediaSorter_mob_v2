appId: com.sza.fastmediasorter.debug
---
# Test: Fullscreen Mode Exit (Command Panel Visibility)
# Description: Verify command panel is visible and accessible after exiting fullscreen mode
# Duration: ~40 seconds
# Tests recent fix: android:fitsSystemWindows="true" in activity_player.xml

# Launch app
- launchApp
- waitForAnimationToEnd

- runFlow: ../_shared/permissions.yaml
- waitForAnimationToEnd

# Navigate to a resource with images (try p2512 from logs)
- scrollUntilVisible:
    element:
      text: "p2512"
    timeout: 10000
    optional: true

- tapOn:
    text: "p2512"
    optional: true
- waitForAnimationToEnd

# Wait for resource to load
- waitForAnimationToEnd

# Find and open an image file
- scrollUntilVisible:
    element:
      text: ".*\\.(jpg|jpeg|png|webp)$"
    timeout: 15000
    optional: true

- tapOn:
    text: ".*\\.(jpg|jpeg|png|webp)$"
    optional: true

# Wait for PlayerActivity to open
- waitForAnimationToEnd

# ============================================
# PHASE 1: Enter Fullscreen Mode
# ============================================

# Tap on image to hide command panel and system bars (enter fullscreen)
- tapOn:
    point: "50%, 50%"
- waitForAnimationToEnd

# Verify we're in fullscreen - command panel should be hidden
# (We can't easily assert invisibility, but the system bars should hide)

# Wait a moment in fullscreen
- waitForAnimationToEnd

# ============================================
# PHASE 2: Exit Fullscreen Mode
# ============================================

# Tap in bottom third of screen (command panel zone) to exit fullscreen
# This should show command panel AND system bars
- tapOn:
    point: "50%, 80%"
- waitForAnimationToEnd

# ============================================
# PHASE 3: Verify Command Panel is Visible
# ============================================

# CRITICAL: Verify command panel buttons are visible and accessible
# These should NOT be hidden under the status bar

- assertVisible:
    id: "com.sza.fastmediasorter.debug:id/btnDelete"
    optional: true

- assertVisible:
    id: "com.sza.fastmediasorter.debug:id/btnFavorite"
    optional: true

- assertVisible:
    id: "com.sza.fastmediasorter.debug:id/btnSlideshowCmd"
    optional: true

# Try to tap on command panel buttons to ensure they're accessible
# If they're hidden under status bar, these taps would fail or hit status bar instead

- tapOn:
    id: "com.sza.fastmediasorter.debug:id/btnSlideshowCmd"
    optional: true
- waitForAnimationToEnd

# Tap again to toggle off if we toggled it on
- tapOn:
    id: "com.sza.fastmediasorter.debug:id/btnSlideshowCmd"
    optional: true
- waitForAnimationToEnd

# ============================================
# PHASE 4: Test Fullscreen Toggle Again
# ============================================

# Enter fullscreen again
- tapOn:
    point: "50%, 50%"
- waitForAnimationToEnd

# Exit fullscreen again
- tapOn:
    point: "50%, 80%"
- waitForAnimationToEnd

# Verify command panel is still visible
- assertVisible:
    id: "com.sza.fastmediasorter.debug:id/btnDelete"
    optional: true

# ============================================
# CLEANUP: Close player and return
# ============================================

- back
- waitForAnimationToEnd

- back
- waitForAnimationToEnd

# Test passed: Fullscreen entry/exit working correctly
# Command panel visible and accessible after exiting fullscreen
