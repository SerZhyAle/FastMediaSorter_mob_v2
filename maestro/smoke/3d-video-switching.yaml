appId: com.sza.fastmediasorter.debug
---
# Test: 3D Mode Switching - Toggle between Auto / Force SBS / Mono
# Feature: 3D Video Support (SBS), v2.63
# Duration: ~60 seconds
# Precondition: A test SBS video (aspect ratio ~32:9, e.g. 3840x1080)
#               must be present on the device at:
#               /sdcard/TestMedia/3D-SBS-Test.mkv
# Setup: run scripts/utils/setup_test_media.ps1 before this test.

# Launch app
- launchApp
- waitForAnimationToEnd

- runFlow: ../_shared/permissions.yaml
- waitForAnimationToEnd

# Navigate to Local tab
- tapOn:
    text: "Local"
    optional: true
- waitForAnimationToEnd

# Navigate into TestMedia folder
- tapOn:
    text: "TestMedia"
    optional: true
- waitForAnimationToEnd

# Open the SBS test video
- tapOn:
    text: "3D-SBS-Test"
- waitForAnimationToEnd

# Enter fullscreen
- tapOn:
    id: ".*fullscreen.*"
    optional: true
- waitForAnimationToEnd

# --- Switch to Force SBS mode ---

# Tap to reveal controls
- tapOn:
    point: "50%, 50%"
- waitForAnimationToEnd

# Open Playback Settings
- tapOn:
    id: ".*settings.*"
    optional: true
- waitForAnimationToEnd

# Verify 3D controls are really visible before switching
- assertVisible:
    text: "3D Video"
- assertVisible:
    text: "Side-by-Side (SBS)"
- waitForAnimationToEnd

# Select SBS mode
- tapOn:
    text: "Side-by-Side (SBS)"
- waitForAnimationToEnd

# Close dialog
- tapOn:
    text: "Close"
- waitForAnimationToEnd

# Verify player still alive after mode switch
- assertNotVisible:
    text: "has stopped"
- assertNotVisible:
    text: "Unfortunately"

# --- Switch to Mono mode ---

# Tap to reveal controls again
- tapOn:
    point: "50%, 50%"
- waitForAnimationToEnd

# Open Playback Settings
- tapOn:
    id: ".*settings.*"
    optional: true
- waitForAnimationToEnd

# Verify Mono option is visible
- assertVisible:
    text: "Mono (Disabled)"
- waitForAnimationToEnd

# Select Mono
- tapOn:
    text: "Mono (Disabled)"
- waitForAnimationToEnd

# Close dialog
- tapOn:
    text: "Close"
- waitForAnimationToEnd

# Verify player still alive after switch back to Mono
- assertNotVisible:
    text: "has stopped"
- assertNotVisible:
    text: "Unfortunately"
- assertNotVisible:
    text: "Error"
    optional: true

# --- Switch back to Auto mode ---

- tapOn:
    point: "50%, 50%"
- waitForAnimationToEnd

- tapOn:
    id: ".*settings.*"
    optional: true
- waitForAnimationToEnd

- assertVisible:
    text: "Auto-detect"
- waitForAnimationToEnd

- tapOn:
    text: "Auto-detect"
- waitForAnimationToEnd

- tapOn:
    text: "Close"
- waitForAnimationToEnd

# Final stability check
- assertNotVisible:
    text: "has stopped"
- assertNotVisible:
    text: "Unfortunately"
