appId: com.sza.fastmediasorter.debug
---
# Test: Standalone Doc Translator Button Parity
# Description: Verify EPUB/PDF translation buttons work in "Open With" (StandalonePlayerActivity)
#   - EPUB: button hidden in portrait, visible in landscape, tappable
#   - PDF:  button hidden in portrait, visible in landscape, tappable
# Duration: ~90 seconds
# Requirements: device with test_media/sample.epub and test_media/sample.pdf accessible

# ── EPUB ──────────────────────────────────────────────────────────────────────

- launchApp:
    appId: com.sza.fastmediasorter.debug
    arguments:
      action: android.intent.action.VIEW
      uri: "file:///sdcard/test_media/sample.epub"
      mimeType: "application/epub+zip"
- waitForAnimationToEnd

# Portrait: translate button must NOT be visible
- setOrientation:
    orientation: portrait
- waitForAnimationToEnd
- assertNotVisible:
    id: "btnTranslateEpubCmd"

# Landscape: translate button must appear (if ENABLE_TRANSLATION=true, enableTranslation=true)
- setOrientation:
    orientation: landscape_left
- waitForAnimationToEnd
- assertVisible:
    id: "btnTranslateEpubCmd"

# Tap to enable translation
- tapOn:
    id: "btnTranslateEpubCmd"
- waitForAnimationToEnd

# Tap again to disable translation
- tapOn:
    id: "btnTranslateEpubCmd"
- waitForAnimationToEnd

# Return to portrait — button must be hidden again
- setOrientation:
    orientation: portrait
- waitForAnimationToEnd
- assertNotVisible:
    id: "btnTranslateEpubCmd"

- back
- waitForAnimationToEnd

# ── PDF ───────────────────────────────────────────────────────────────────────

- launchApp:
    appId: com.sza.fastmediasorter.debug
    arguments:
      action: android.intent.action.VIEW
      uri: "file:///sdcard/test_media/sample.pdf"
      mimeType: "application/pdf"
- waitForAnimationToEnd

# Portrait: translate button must NOT be visible (PdfViewerManager hides it)
- setOrientation:
    orientation: portrait
- waitForAnimationToEnd
- assertNotVisible:
    id: "btnTranslatePdfCmd"

# Landscape: translate button must appear
- setOrientation:
    orientation: landscape_left
- waitForAnimationToEnd
- assertVisible:
    id: "btnTranslatePdfCmd"

# Tap to enable translation
- tapOn:
    id: "btnTranslatePdfCmd"
- waitForAnimationToEnd

# Tap again to disable translation
- tapOn:
    id: "btnTranslatePdfCmd"
- waitForAnimationToEnd

- back
- waitForAnimationToEnd

# Reset orientation
- setOrientation:
    orientation: portrait
