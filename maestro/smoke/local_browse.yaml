appId: com.sza.fastmediasorter.debug
---
# Test: Local Browse (Resilient)
# Description: Verify local file browsing functionality
# Duration: ~30 seconds

# Start from app launch
- launchApp
- waitForAnimationToEnd

- runFlow: ../_shared/permissions.yaml
- waitForAnimationToEnd

# Try to navigate to Local tab
- tapOn:
    text: "Local"
    optional: true

# Wait for file list to load
- waitForAnimationToEnd

# Verify any content is visible (flexible check)
- assertVisible:
    id: ".*recycler.*"
    optional: true

# Try scrolling - verifies UI is interactive
- scroll

# Scroll back
- scroll
    
# Try to tap a list item
- tapOn:
    text: ".*"
    index: 0
    optional: true

# Wait for content
- waitForAnimationToEnd

# Navigate back
- back
- waitForAnimationToEnd

# Verify app is still responsive
- tapOn:
    point: "50%,50%"
- waitForAnimationToEnd
