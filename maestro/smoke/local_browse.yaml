appId: com.sza.fastmediasorter.debug
# prepared-device: needs the seeded test corpus and the all-files grants of the test phone (setup_test_media.ps1).
# The CI emulator is a clean install, so .github/workflows/maestro-tests.yml excludes this tag.
tags:
  - prepared-device
---
# Smoke: local browse opens a deterministic built-in resource (S0551).
# Precondition: seeded images are indexed by MediaStore.
# Oracle: All Images opens, rvMediaFiles renders, and a known seeded file is visible.

- launchApp
- runFlow: ../_shared/permissions.yaml
- runFlow: ../_shared/go_home.yaml
- assertNotVisible:
    text: "Отправить отчёт о сбое?"
- assertVisible:
    id: "com.sza.fastmediasorter.debug:id/tabResourceTypes"

- scroll
- tapOn:
    text: "Локальные"
    index: 0
- runFlow: ../_shared/open_all_images.yaml
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/rvMediaFiles"
    timeout: 15000
- assertVisible:
    text: "photo_001.jpg"
