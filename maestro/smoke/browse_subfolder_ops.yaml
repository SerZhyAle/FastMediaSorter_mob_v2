appId: com.sza.fastmediasorter.debug
---
# Test: Browse Subfolder Operations
# Objective: Verify that directories can be selected and subfolder operations (copy, move, rename, delete) are accessible.
# Duration: ~30 seconds

- launchApp

- waitForAnimationToEnd

# Navigate to Browse tab
- assertVisible:
    id: ".*:id/browse_tab"

- tapOn:
    id: ".*:id/browse_tab"

- waitForAnimationToEnd

# Verify file list
- assertVisible:
    id: ".*:id/file_list"

# Scroll slightly to ensure list is active
- scroll

- waitForAnimationToEnd

# Long-tap the first item (assuming list is grouped folders first)
- longPressOn:
    index: 0
    optional: true

- waitForAnimationToEnd

# Check for file operation action buttons that apply to directories
- assertVisible:
    id: ".*:id/action_delete"
    optional: true

- assertVisible:
    id: ".*:id/action_copy"
    optional: true

- assertVisible:
    id: ".*:id/action_move"
    optional: true

# Check via text instead since some menus are textual context menus
- assertVisible:
    text: "Copy"
    optional: true

- assertVisible:
    text: "Move"
    optional: true

- assertVisible:
    text: "Delete"
    optional: true

- assertVisible:
    text: "Rename"
    optional: true

- tapOn:
    text: "Rename"
    optional: true

- waitForAnimationToEnd

# Cancel out of any dialogs to keep test pure smoke
- back

- waitForAnimationToEnd

# Ensure we're back at the list
- assertVisible:
    id: ".*:id/file_list"
