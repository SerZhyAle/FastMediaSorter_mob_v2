appId: com.sza.fastmediasorter.debug
---
# Smoke: app launches to the resource list with no crash (S0551 Phase 02, rewrite).
# Replaces the prior all-`optional` fictitious flow with a real launch oracle.
# No clearState: the suite's resource-dependent flows rely on registered resources
# (S0551 resource-precondition decision); a cold-wipe belongs to a dedicated setup step.
# Oracle: the resource-type tabs + Add-resource control render, and no crash-report prompt.

- launchApp
- runFlow: ../_shared/permissions.yaml
- assertNotVisible:
    text: "Отправить отчёт о сбое?"
- assertVisible:
    id: "com.sza.fastmediasorter.debug:id/tabResourceTypes"
- assertVisible:
    id: "com.sza.fastmediasorter.debug:id/btnAddResource"
