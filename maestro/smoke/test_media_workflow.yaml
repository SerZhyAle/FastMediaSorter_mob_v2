appId: com.sza.fastmediasorter.debug
---
# Test: Test Media Full Workflow
# Description: Complete workflow with test media files uploaded by setup_test_media.ps1
# Duration: ~2-3 minutes
# Prerequisites: Run scripts/setup_test_media.ps1 to upload test files to /sdcard/Download/FastMediaSorter_Test

# Launch app
- launchApp
- waitForAnimationToEnd

- runFlow: ../_shared/permissions.yaml
- waitForAnimationToEnd

# Navigate to Local tab
- tapOn:
    text: "Local"
    optional: true
- waitForAnimationToEnd

# Navigate to Download folder (common location)
- scrollUntilVisible:
    element:
      text: "Download"
    timeout: 10000
    optional: true

- tapOn:
    text: "Download"
    optional: true
- waitForAnimationToEnd

# Navigate to FastMediaSorter_Test folder
- scrollUntilVisible:
    element:
      text: "FastMediaSorter_Test"
    timeout: 10000
    optional: true

- tapOn:
    text: "FastMediaSorter_Test"
    optional: true
- waitForAnimationToEnd

# ============================================
# PHASE 1: Image Viewing
# ============================================

# Find and open an image file
- scrollUntilVisible:
    element:
      text: ".*\\.(jpg|jpeg|png|webp)$"
    timeout: 10000
    optional: true

- tapOn:
    text: ".*\\.(jpg|jpeg|png|webp)$"
    optional: true
- waitForAnimationToEnd

# Verify image viewer opened
- tapOn:
    point: "50%,50%"
- waitForAnimationToEnd

# Try swipe to next image
- swipe:
    direction: LEFT
- waitForAnimationToEnd

# Swipe back
- swipe:
    direction: RIGHT
- waitForAnimationToEnd

# Close image viewer
- back
- waitForAnimationToEnd

# ============================================
# PHASE 2: Video Playback
# ============================================

# Find and play video file
- scrollUntilVisible:
    element:
      text: ".*\\.(mp4|webm|mkv|mov)$"
    timeout: 10000
    optional: true

- tapOn:
    text: ".*\\.(mp4|webm|mkv|mov)$"
    optional: true
- waitForAnimationToEnd

# Wait for video player to load
- waitForAnimationToEnd

# Tap center to show/hide controls
- tapOn:
    point: "50%,50%"
- waitForAnimationToEnd

# Try pause/play
- tapOn:
    id: ".*play.*"
    optional: true
- waitForAnimationToEnd

- tapOn:
    id: ".*pause.*"
    optional: true
- waitForAnimationToEnd

# Close video player
- back
- waitForAnimationToEnd

# ============================================
# PHASE 3: Audio Playback
# ============================================

# Find and play audio file
- scrollUntilVisible:
    element:
      text: ".*\\.(mp3|flac)$"
    timeout: 10000
    optional: true

- tapOn:
    text: ".*\\.(mp3|flac)$"
    optional: true
- waitForAnimationToEnd

# Wait for audio player
- waitForAnimationToEnd

# Verify playback controls are visible
- tapOn:
    id: ".*play.*"
    optional: true
- waitForAnimationToEnd

# Try next track
- tapOn:
    id: ".*next.*"
    optional: true
- waitForAnimationToEnd

# Close audio player
- back
- waitForAnimationToEnd

# ============================================
# PHASE 4: File Operations
# ============================================

# Long press on a file for context menu
- longPressOn:
    text: ".*\\.(jpg|mp3|mp4)$"
    optional: true

- waitForAnimationToEnd

# Try to access file operations (copy/move/delete)
- tapOn:
    text: "Copy"
    optional: true

- tapOn:
    text: "Move"
    optional: true

- tapOn:
    text: "Delete"
    optional: true

# Cancel any dialog
- back
- waitForAnimationToEnd

# ============================================
# PHASE 5: Filtering & Search
# ============================================

# Try filter buttons if available
- tapOn:
    text: "Images"
    optional: true
- waitForAnimationToEnd

- tapOn:
    text: "Videos"
    optional: true
- waitForAnimationToEnd

- tapOn:
    text: "Audio"
    optional: true
- waitForAnimationToEnd

- tapOn:
    text: "ALL"
    optional: true
- waitForAnimationToEnd

# Try search if available
- tapOn:
    id: ".*search.*"
    optional: true
- waitForAnimationToEnd

- back
- waitForAnimationToEnd

# ============================================
# FINAL: Return to main screen
# ============================================

- back
- back
- waitForAnimationToEnd

# Verify app is still responsive
- tapOn:
    point: "50%,50%"
- waitForAnimationToEnd

# Test passed: Full workflow with test media completed
