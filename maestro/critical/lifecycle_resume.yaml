appId: com.sza.fastmediasorter.debug
---
# Test: Lifecycle Resume
# Description: Background and foreground the app
# Duration: ~35 seconds

- launchApp
- waitForAnimationToEnd
- runFlow: ../_shared/permissions.yaml
- waitForAnimationToEnd

- assertVisible:
    id: "com.sza.fastmediasorter.debug:id/btnRefresh"

- pressKey: HOME
- waitForAnimationToEnd

- launchApp
- waitForAnimationToEnd

- assertVisible:
    id: "com.sza.fastmediasorter.debug:id/btnSettings"
