appId: com.sza.fastmediasorter.debug
---
# Test: Video Offload (Save Local Copy) Flow
# Description: Critical path — open a network video, trigger offload offer, accept, verify progress dialog,
#              then verify cleanup prompt appears after playback ends
# Duration: ~60 seconds
# Prerequisite: one SMB/SFTP/FTP source configured with a video file reachable from the test device

- launchApp
- waitForAnimationToEnd

- runFlow: ../_shared/permissions.yaml
- waitForAnimationToEnd

# ── Step 1: Open a network video ────────────────────────────────────────────

- tapOn:
    text: ".*\\.(mp4|mkv|avi|mov)$"
    optional: true

- waitForAnimationToEnd

# ── Step 2: Wait for offload offer BottomSheet to appear ────────────────────
# PlayerViewModel emits offloadOffer after plan determines the file is suitable

- wait:
    timeout: 8000

- assertVisible:
    text: "(Save to local copy\\?|Сохранить локальную копию\\?|Зберегти локальну копію\\?)"
    optional: true

# ── Step 3: Accept — tap "Save local copy" button ───────────────────────────

- tapOn:
    text: "(Save local copy|Сохранить локальную копию|Зберегти локальну копію)"
    optional: true

- waitForAnimationToEnd

# ── Step 4: Verify FileCopyProgressDialog or download progress is visible ───

- assertVisible:
    id: ".*progress.*"
    optional: true

- wait:
    timeout: 15000

# ── Step 5: After download — overlay switches to green "local copy" pill ────

- assertVisible:
    id: ".*prefetch_overlay.*"
    optional: true

# ── Step 6: Let playback finish; cleanup prompt should appear ────────────────

- wait:
    timeout: 10000

- assertVisible:
    text: "(Local copy ready|Локальная копия готова|Локальна копія готова)"
    optional: true

# Tap Keep
- tapOn:
    text: "(Keep|Оставить|Залишити)"
    optional: true

- waitForAnimationToEnd

# ── Step 7: Navigate back, verify app is stable ─────────────────────────────

- back
- waitForAnimationToEnd

- assertVisible:
    id: "com.sza.fastmediasorter.debug:id/recyclerView"
    optional: true
