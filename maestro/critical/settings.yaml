appId: com.sza.fastmediasorter.debug
---
# Critical: settings screen survives relaunch (S0551).
# Oracle: Settings title renders before and after stop/start, with no crash prompt.

- launchApp
- runFlow: ../_shared/permissions.yaml
- runFlow: ../_shared/go_home.yaml
- assertNotVisible:
    text: "Отправить отчёт о сбое?"

- tapOn:
    id: "com.sza.fastmediasorter.debug:id/btnSettings"
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/titleText"
    timeout: 10000
- assertVisible:
    id: "com.sza.fastmediasorter.debug:id/titleText"

- scroll
- stopApp
- waitForAnimationToEnd
- launchApp
- runFlow: ../_shared/permissions.yaml
- runFlow: ../_shared/go_home.yaml
- assertNotVisible:
    text: "Отправить отчёт о сбое?"
- tapOn:
    id: "com.sza.fastmediasorter.debug:id/btnSettings"
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/titleText"
    timeout: 10000
- assertVisible:
    id: "com.sza.fastmediasorter.debug:id/titleText"
