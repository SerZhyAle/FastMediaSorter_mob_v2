appId: com.sza.fastmediasorter.debug
---
# Test: File Operations (Resilient)
# Description: Verify file-ops UI entry points without hardcoding specific folders/files
# Duration: ~40 seconds

- launchApp
- waitForAnimationToEnd

- runFlow: ../_shared/permissions.yaml
- waitForAnimationToEnd

# Try to enter local context (not all layouts expose this tab)
- tapOn:
    text: "(Local|Локально|Локальне)"
    optional: true

- waitForAnimationToEnd

# Validate media list container if present
- assertVisible:
    id: "com.sza.fastmediasorter.debug:id/rvMediaFiles"
    optional: true

# Try selecting any first visible item and opening actions menu via long press
- longPressOn:
    text: ".*"
    index: 0
    optional: true

- waitForAnimationToEnd

# Accept either copy or move action if available
- tapOn:
    text: "(Copy|Копировать|Move|Переместить)"
    optional: true

- waitForAnimationToEnd

# If destination/paste UI appears, complete it opportunistically
- tapOn:
    text: "(Paste|Вставить|Confirm|Подтвердить|OK|ОК)"
    optional: true

- waitForAnimationToEnd

- back
