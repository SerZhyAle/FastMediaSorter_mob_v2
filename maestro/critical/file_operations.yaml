appId: com.sza.fastmediasorter.debug
---
# Test: Copy and move files from Ops/src to Ops/dst (S0551 Phase 03).
# Precondition: clean preparation exposes the standard "Загрузки" LOCAL resource and seeds
#   Ops/src + Ops/dst under /storage/emulated/0/Download. Required files:
#   Ops/src/IMG_copy_01.png, Ops/src/IMG_move_01.png.
# Oracle: copy leaves the source visible and creates the destination entry; move creates
#   the destination entry and removes the source entry. Exact ids/text only.

- launchApp
- runFlow: ../_shared/permissions.yaml
- assertNotVisible:
    text: "Отправить отчёт о сбое?"

- tapOn:
    text: "Локальные"
    index: 0
- scrollUntilVisible:
    visibilityPercentage: 30
    element:
      text: "Загрузки"
    timeout: 10000
- tapOn:
    text: "Загрузки"
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/rvMediaFiles"
    timeout: 15000

# Copy: source stays in Ops/src, destination gains a copy.
# S2171 moved the name filter into the live search overlay; dialog_filter.xml keeps only type,
# date and size. Both write FileFilter.nameContains, so the narrowing below is unchanged.
- tapOn:
    id: "com.sza.fastmediasorter.debug:id/btnSearch"
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/etSearchQuery"
    timeout: 10000
- tapOn:
    id: "com.sza.fastmediasorter.debug:id/etSearchQuery"
- inputText: "IMG_copy_01"
# The overlay narrows live - no Apply button. Drop the IME so it does not cover the list rows.
- hideKeyboard
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "IMG_copy_01.png"
    timeout: 10000
- longPressOn:
    text: "IMG_copy_01.png"
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/btnCopy"
    timeout: 8000
- tapOn:
    id: "com.sza.fastmediasorter.debug:id/btnCopy"
- extendedWaitUntil:
    visible:
      text: "Ops/dst"
    timeout: 10000
- tapOn:
    text: "Ops/dst"
- extendedWaitUntil:
    visible:
      text: "(Completed|Готово|Завершено|IMG_copy_01.png)"
    timeout: 20000
- back
- scrollUntilVisible:
    visibilityPercentage: 30
    element:
      text: "Ops/dst"
    timeout: 10000
- tapOn:
    text: "Ops/dst"
- extendedWaitUntil:
    visible:
      text: "IMG_copy_01.png"
    timeout: 15000
- assertVisible:
    text: "IMG_copy_01.png"
- back
- scrollUntilVisible:
    visibilityPercentage: 30
    element:
      text: "IMG_copy_01.png"
    timeout: 10000
- assertVisible:
    text: "IMG_copy_01.png"

# Move: destination gains the file and source listing no longer shows it.
# Closing the search overlay clears the query, which resets nameContains - the equivalent of the
# old btnClearFilter round-trip through the dialog.
- tapOn:
    id: "com.sza.fastmediasorter.debug:id/btnSearchClose"
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/rvMediaFiles"
    timeout: 10000
- tapOn:
    id: "com.sza.fastmediasorter.debug:id/btnSearch"
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/etSearchQuery"
    timeout: 10000
- tapOn:
    id: "com.sza.fastmediasorter.debug:id/etSearchQuery"
- inputText: "IMG_move_01"
# The overlay narrows live - no Apply button. Drop the IME so it does not cover the list rows.
- hideKeyboard
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "IMG_move_01.png"
    timeout: 10000
- longPressOn:
    text: "IMG_move_01.png"
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/btnMove"
    timeout: 8000
- tapOn:
    id: "com.sza.fastmediasorter.debug:id/btnMove"
- extendedWaitUntil:
    visible:
      text: "Ops/dst"
    timeout: 10000
- tapOn:
    text: "Ops/dst"
- extendedWaitUntil:
    visible:
      text: "(Completed|Готово|Завершено|IMG_move_01.png)"
    timeout: 20000
- back
- scrollUntilVisible:
    visibilityPercentage: 30
    element:
      text: "Ops/dst"
    timeout: 10000
- tapOn:
    text: "Ops/dst"
- extendedWaitUntil:
    visible:
      text: "IMG_move_01.png"
    timeout: 15000
- assertVisible:
    text: "IMG_move_01.png"
- back

# Drop the narrowing before the final oracle. With the query still set, "IMG_move_01.png is not in
# the source listing" holds for the wrong reason - the query hides everything else too, so the
# assertion would pass even if the move had not happened. Closing the overlay also stops the query
# leaking into the next flow that opens this resource.
- runFlow:
    when:
      visible:
        id: "com.sza.fastmediasorter.debug:id/btnSearchClose"
    commands:
      - tapOn:
          id: "com.sza.fastmediasorter.debug:id/btnSearchClose"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "com.sza.fastmediasorter.debug:id/rvMediaFiles"
    timeout: 10000
- assertNotVisible:
    text: "IMG_move_01.png"
