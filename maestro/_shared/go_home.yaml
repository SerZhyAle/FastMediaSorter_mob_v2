appId: com.sza.fastmediasorter.debug
---
# Return to the main resource-type tabs screen (MainActivity).
#
# resumeOnNextLaunch is on by default, so a cold launch reopens the last played file directly
# in the player. In a multi-flow suite that means any flow running after a player flow would
# start inside the restored player instead of the main screen. This fragment backs out of any
# restored player/browse screen until the resource-type tabs are shown, giving every capability
# flow a deterministic MainActivity starting point.
#
# S4252: the fragment is a fast path plus the old cascade as an escape. Maestro 2.6.1 answers a
# lookup that succeeds in 0.2-1 s and spends ~7 s (once per unbroken run of failures) on one that
# fails, and the seven guards this fragment used to run were all `notVisible` on the tabs - a
# failure whenever the tabs were already on screen, which is where every guard after the first
# back press found them. Measured 2026-10-15: the fragment cost 12-15 s, of which about 7 s was that
# single wait. The common start is the restored player or browse screen, so:
# - the guard on a missing tab strip is kept as the first step (a success there: the strip is
#   absent), and so is its single back press;
# - after the back, `extendedWaitUntil` returns as soon as the strip is visible instead of the
#   fixed animation wait, and a positive `visible` check - a success - replaces the `notVisible`
#   chain as the question "are we home?";
# - only when that check fails does go_home_escape.yaml run: the previous cascade, unchanged.
#
# One ~7 s wait remains by design: when the tabs are already on screen at the start, the first
# guard is a failed lookup and costs what it always cost. The two start states cannot both be
# answered by a success - the check that is fast for one is the slow one for the other - so the
# order favours the restored player, which is the usual start of a flow after a flow that opened
# a file.
- runFlow:
    when:
      notVisible:
        id: "com.sza.fastmediasorter.debug:id/tabResourceTypes"
    commands:
      - back
      - extendedWaitUntil:
          visible:
            id: "com.sza.fastmediasorter.debug:id/tabResourceTypes"
          timeout: 2000
          optional: true

- evalScript: ${output.homeReached = false}
- runFlow:
    when:
      visible:
        id: "com.sza.fastmediasorter.debug:id/tabResourceTypes"
    commands:
      - evalScript: ${output.homeReached = true}
- runFlow:
    when:
      true: ${!output.homeReached}
    file: go_home_escape.yaml

- assertVisible:
    id: "com.sza.fastmediasorter.debug:id/tabResourceTypes"
    label: "Main resource-type tabs reached (after back-cascade and relaunch escape - S1673)"
