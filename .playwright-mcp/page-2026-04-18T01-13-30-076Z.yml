                    - img [ref=e474]
                - paragraph [ref=e476]: "LibVLC is the Android library embedding VLC engine, which provides a lot of multimedia features, like:"
                - list [ref=e477]:
                  - listitem [ref=e478]: Play every media file formats, every codec and every streaming protocols
                  - listitem [ref=e479]: Hardware and efficient decoding on every platform, up to 8K
                  - listitem [ref=e480]: Network browsing for distant filesystems (SMB, FTP, SFTP, NFS...) and servers (UPnP, DLNA)
                  - listitem [ref=e481]: Playback of Audio CD, DVD and Bluray with menu navigation
                  - listitem [ref=e482]: Support for HDR, including tonemapping for SDR streams
                  - listitem [ref=e483]: Audio passthrough with SPDIF and HDMI, including for Audio HD codecs, like DD+, TrueHD or DTS-HD
                  - listitem [ref=e484]: Support for video and audio filters
                  - listitem [ref=e485]: Support for 360 video and 3D audio playback, including Ambisonics
                  - listitem [ref=e486]: Ability to cast and stream to distant renderers, like Chromecast and UPnP renderers.
                - paragraph [ref=e487]: And more.
                - paragraph [ref=e488]:
                  - link "LibVLC stack" [ref=e489] [cursor=pointer]:
