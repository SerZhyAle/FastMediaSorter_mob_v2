<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" lang="uk"><title id="t">Яким шляхом іде потік</title><desc id="d">Три шляхи в тому порядку, в якому їх пробує отримувач: напряму в тій самій мережі, через ретранслятор сервера обміну, через тунель сервера.</desc><defs><marker id="arr-control" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1565c0"/></marker><marker id="arr-control-s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#1565c0"/></marker><marker id="arr-tunnel" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker><marker id="arr-tunnel-s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#2e7d32"/></marker><marker id="arr-media" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e65100"/></marker><marker id="arr-media-s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#e65100"/></marker><marker id="arr-lan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6a1b9a"/></marker><marker id="arr-lan-s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#6a1b9a"/></marker><marker id="arr-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker><marker id="arr-danger-s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#c62828"/></marker><marker id="arr-server" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#00796b"/></marker><marker id="arr-server-s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#00796b"/></marker><marker id="arr-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6b7f"/></marker><marker id="arr-muted-s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#5b6b7f"/></marker><marker id="arr-text" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f2933"/></marker><marker id="arr-text-s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#1f2933"/></marker><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.18"/></filter><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter></defs><rect width="1600" height="900" fill="#f6f8fb"/><text x="60" y="78" font-family="'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="60" dy="0">Яким шляхом іде потік</tspan></text><text x="60" y="127.8" font-family="'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#5b6b7f" text-anchor="start"><tspan x="60" dy="0">Отримувач пробує шляхи в цьому порядку й після будь-якого перепід'єднання починає згори.</tspan></text><rect x="200" y="200" width="1200" height="175" rx="22" fill="#ffffff" stroke="#d5dde8" stroke-width="1.5" filter="url(#soft)"/><rect x="200" y="200" width="12" height="175" rx="6" fill="#6a1b9a" stroke="none" stroke-width="1.5"/><circle cx="270" cy="287" r="30" fill="#6a1b9a" stroke="none" stroke-width="2"/><text x="270" y="297.8" font-family="'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="31.5" font-weight="700" fill="#f6f8fb" text-anchor="middle"><tspan x="270" dy="0">1</tspan></text><g transform="translate(330 255) scale(2.7)"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z" fill="#6a1b9a"/></g><text x="425" y="262" font-family="'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="425" dy="0">Та сама мережа - напряму</tspan></text><text x="425" y="302" font-family="'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5b6b7f" text-anchor="start"><tspan x="425" dy="0">Телефон, годинник і ПК в одній мережі Wi-Fi: отримувач під'єднується</tspan><tspan x="425" dy="24.3">просто до того, хто мовить. Нічого не виходить з дому.</tspan></text><rect x="1190" y="262" width="180" height="50" rx="25" fill="#6a1b9a" stroke="none" stroke-width="1.5" opacity="0.1"/><text x="1280" y="294" font-family="'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#6a1b9a" text-anchor="middle"><tspan x="1280" dy="0">найшвидше</tspan></text><rect x="200" y="420" width="1200" height="175" rx="22" fill="#ffffff" stroke="#d5dde8" stroke-width="1.5" filter="url(#soft)"/><rect x="200" y="420" width="12" height="175" rx="6" fill="#e65100" stroke="none" stroke-width="1.5"/><circle cx="270" cy="507" r="30" fill="#e65100" stroke="none" stroke-width="2"/><text x="270" y="517.8" font-family="'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="31.5" font-weight="700" fill="#f6f8fb" text-anchor="middle"><tspan x="270" dy="0">2</tspan></text><g transform="translate(330 475) scale(2.7)"><path d="M7.76 16.24C6.67 15.16 6 13.66 6 12s.67-3.16 1.76-4.24l1.42 1.42C8.45 9.9 8 10.9 8 12c0 1.1.45 2.1 1.17 2.83l-1.41 1.41zm8.48 0C17.33 15.16 18 13.66 18 12s-.67-3.16-1.76-4.24l-1.42 1.42C15.55 9.9 16 10.9 16 12c0 1.1-.45 2.1-1.17 2.83l1.41 1.41zM12 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm8 2c0 2.21-.9 4.21-2.35 5.65l1.42 1.42C20.88 17.26 22 14.76 22 12s-1.12-5.26-2.93-7.070l-1.42 1.42C19.1 7.79 20 9.79 20 12zM6.35 6.35L4.93 4.93C3.12 6.74 2 9.24 2 12s1.12 5.26 2.93 7.07l1.42-1.42C4.9 16.21 4 14.21 4 12s.9-4.21 2.35-5.65z" fill="#e65100"/></g><text x="425" y="482" font-family="'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="425" dy="0">Ретранслятор сервера обміну</tspan></text><text x="425" y="522" font-family="'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5b6b7f" text-anchor="start"><tspan x="425" dy="0">Той, хто мовить, надсилає потік один раз; сервер роздає його</tspan><tspan x="425" dy="24.3">кожному слухачеві. Працює з будь-якої мережі.</tspan></text><rect x="1190" y="482" width="180" height="50" rx="25" fill="#e65100" stroke="none" stroke-width="1.5" opacity="0.1"/><text x="1280" y="514" font-family="'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#e65100" text-anchor="middle"><tspan x="1280" dy="0">близько 2 с</tspan></text><rect x="200" y="640" width="1200" height="175" rx="22" fill="#ffffff" stroke="#d5dde8" stroke-width="1.5" filter="url(#soft)"/><rect x="200" y="640" width="12" height="175" rx="6" fill="#1565c0" stroke="none" stroke-width="1.5"/><circle cx="270" cy="727" r="30" fill="#1565c0" stroke="none" stroke-width="2"/><text x="270" y="737.8" font-family="'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="31.5" font-weight="700" fill="#f6f8fb" text-anchor="middle"><tspan x="270" dy="0">3</tspan></text><g transform="translate(330 695) scale(2.7)"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" fill="#1565c0"/></g><text x="425" y="702" font-family="'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="425" dy="0">Тунель через сервер</tspan></text><text x="425" y="742" font-family="'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5b6b7f" text-anchor="start"><tspan x="425" dy="0">Окрема лінія на слухача - для плеєрів, яким потрібна</tspan><tspan x="425" dy="24.3">вихідна адреса RTSP або HTTP.</tspan></text><rect x="1190" y="702" width="180" height="50" rx="25" fill="#1565c0" stroke="none" stroke-width="1.5" opacity="0.1"/><text x="1280" y="734" font-family="'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1565c0" text-anchor="middle"><tspan x="1280" dy="0">близько 2 с</tspan></text><path d="M140 290 L140 368" fill="none" stroke="#5b6b7f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 434 L140 505" fill="none" stroke="#5b6b7f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-muted)"/><path d="M140 510 L140 586" fill="none" stroke="#5b6b7f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 652 L140 725" fill="none" stroke="#5b6b7f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-muted)"/><text x="140" y="396.2" font-family="'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5b6b7f" text-anchor="middle"><tspan x="140" dy="0">не</tspan><tspan x="140" dy="17.5">доступно</tspan></text><text x="140" y="614.2" font-family="'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5b6b7f" text-anchor="middle"><tspan x="140" dy="0">не</tspan><tspan x="140" dy="17.5">доступно</tspan></text></svg>
