etica Neue', Arial, sans-serif" font-size="29.4" font-weight="700" fill="#0a1628" text-anchor="middle"><tspan x="154" dy="0">3</tspan></text><g transform="translate(830 676) scale(2.4)" opacity="0.9"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z" fill="#34d399"/></g><text x="140" y="790" font-family="'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="start"><tspan x="140" dy="0">Отправьте или откройте</tspan></text><text x="140" y="840" font-family="'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#a9bdd2" text-anchor="start"><tspan x="140" dy="0">«Отправить в..» на устройство или</tspan><tspan x="140" dy="29.4">папка из «С моих устройств» -</tspan><tspan x="140" dy="29.4">через Google Drive</tspan></text><rect x="1000" y="640" width="820" height="330" rx="24" fill="#10243b" stroke="#1f4f5f" stroke-width="1.5"/><rect x="1000" y="640" width="820" height="8" rx="4" fill="#fbbf24" stroke="none" stroke-width="1.5"/><circle cx="1054" cy="710" r="28" fill="#fbbf24" stroke="none" stroke-width="2"/><text x="1054" y="720.1" font-family="'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="29.4" font-weight="700" fill="#0a1628" text-anchor="middle"><tspan x="1054" dy="0">4</tspan></text><g transform="translate(1730 676) scale(2.4)" opacity="0.9"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z" fill="#fbbf24"/></g><text x="1040" y="790" font-family="'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="start"><tspan x="1040" dy="0">Дождитесь ответа</tspan></text><text x="1040" y="840" font-family="'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#a9bdd2" text-anchor="start"><tspan x="1040" d