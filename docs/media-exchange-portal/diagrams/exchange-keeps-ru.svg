text><circle cx="144" cy="492.4" r="5.1" fill="#34d399" stroke="none" stroke-width="2"/><text x="162.4" y="500" font-family="'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="400" fill="#ffffff" text-anchor="start"><tspan x="162.4" dy="0">Учётные записи: логин</tspan><tspan x="162.4" dy="28.8">и скрытый пароль</tspan></text><circle cx="144" cy="597.4" r="5.1" fill="#34d399" stroke="none" stroke-width="2"/><text x="162.4" y="605" font-family="'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="400" fill="#ffffff" text-anchor="start"><tspan x="162.4" dy="0">Устройства: имя, тип,</tspan><tspan x="162.4" dy="28.8">когда были в сети</tspan></text><circle cx="144" cy="702.4" r="5.1" fill="#34d399" stroke="none" stroke-width="2"/><text x="162.4" y="710" font-family="'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="400" fill="#ffffff" text-anchor="start"><tspan x="162.4" dy="0">Названия общих папок</tspan></text><circle cx="144" cy="807.4" r="5.1" fill="#34d399" stroke="none" stroke-width="2"/><text x="162.4" y="815" font-family="'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="400" fill="#ffffff" text-anchor="start"><tspan x="162.4" dy="0">Журнал: входы и</tspan><tspan x="162.4" dy="28.8">подключения, id скрыты</tspan></text><rect x="700" y="280" width="520" height="660" rx="26" fill="#10243b" stroke="#38bdf8" stroke-width="2"/><rect x="700" y="280" width="520" height="10" rx="5" fill="#38bdf8" stroke="none" stroke-width="1.5"/><g><circle cx="790" cy="380" r="64" fill="#38bdf8" stroke="none" stroke-width="2" opacity="0.1"/><circle cx="790" cy="380" r="46" fill="#12304a" stroke="#38bdf8" stroke-width="3"/><g transform="translate(768.2 358.2) scale(1.8)"><path d="M15 9H9v6h6V9zm-2 4h-2v-2h2v2zm8-2V9h-2V7c0-1.1-.9-2-2-2h-2V3h-2v2h-2V3H9v2H7c-1.1 0-2 .9-2 2v2H3v2h2v2H3v2h2v2c0 1.1.9 2 2 2