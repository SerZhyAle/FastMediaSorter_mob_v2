# S0720: detekt config. Relies on buildUponDefaultConfig = true - this file only
# enables the ktlint formatting ruleset and applies a few sensible threshold overrides
# on top of detekt's bundled defaults. Defaults + a frozen baseline is the point; do not
# over-tune. Do NOT enable rules that require type resolution (this gate runs lexically).

formatting:
  active: true
  android: true
  autoCorrect: false

# S1450: detekt's own defaults already exempt test sources from these two rules, but their default
# pattern is '**/test/**', which matches src/test and misses every flavor unit-test source set -
# src/testStandard, src/testNoLegal, src/testVr, and the src/testStreamingEnabled /
# src/testCloudEnabled sets S1450 added. That gap is why a test file moved from src/test into a
# flavor set suddenly reports FunctionNaming on backtick test names, and why the pre-existing
# src/testStandard file carries a hand-written @Suppress("FunctionNaming").
# The '**/test*/**' pattern below covers src/test itself and every test<Flavor>/test<Capability>
# set. This restores detekt's intended default to the paths its pattern misses; it is not a
# threshold relaxation. Listing the rest of the default list is required because a declared
# 'excludes' replaces the default rather than adding to it.
naming:
  FunctionNaming:
    excludes: ['**/test*/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/jsTest/**', '**/iosTest/**']

style:
  MagicNumber:
    excludes: ['**/test*/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/jsTest/**', '**/iosTest/**', '**/*.kts']

complexity:
  active: true
  LongMethod:
    active: true
    threshold: 80
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 10
  NestedBlockDepth:
    active: true
    threshold: 5
  CyclomaticComplexMethod:
    active: true
    threshold: 20
  TooManyFunctions:
    active: true
    thresholdInFiles: 40
    thresholdInClasses: 40
    thresholdInInterfaces: 40
    thresholdInObjects: 40
    thresholdInEnums: 40
